name: PoC Nagoya Meijo Meiko Open Data

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-meijo-meiko-open-data.yml'
      - 'scripts/extract-nagoya-subway.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-meijo-meiko-open-data.yml'
      - 'scripts/extract-nagoya-subway.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download official Meijo and Meiko timetable ZIPs
        shell: bash
        run: |
          set -euo pipefail

          MEIJO_URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/e6fb0551-8fba-49fd-b0ef-c2dc5e2444e4/download/20250929_subway-timetable-meijoline.zip'
          MEIKO_URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/5e684b8c-81d4-4df3-b325-795325e0773c/download/20250929_subway-timetable-meikoline.zip'

          curl -fsSL "$MEIJO_URL" -o /tmp/meijo.zip
          curl -fsSL "$MEIKO_URL" -o /tmp/meiko.zip

      - name: Inspect Sakae M05 workbook and sheet names
        shell: bash
        run: |
          python3 - <<'PY'
          import io
          import json
          import unicodedata
          import zipfile
          import xml.etree.ElementTree as ET

          NS = {
              "m": "http://schemas.openxmlformats.org/spreadsheetml/2006/main"
          }

          def recover(name):
              try:
                  return name.encode("cp437").decode("cp932")
              except (UnicodeEncodeError, UnicodeDecodeError):
                  return name

          def inspect(path, label):
              with zipfile.ZipFile(path) as outer:
                  files = []
                  for info in outer.infolist():
                      if info.is_dir() or not info.filename.lower().endswith(".xlsx"):
                          continue
                      recovered = unicodedata.normalize("NFKC", recover(info.filename))
                      files.append((info, recovered))

                  print(f"=== {label} XLSX count={len(files)} ===")
                  for _, name in files:
                      print(name)

                  candidates = [
                      (info, name)
                      for info, name in files
                      if "M05" in name.upper() and "栄" in name
                  ]

                  print(
                      f"=== {label} Sakae M05 candidates ===",
                      json.dumps([name for _, name in candidates], ensure_ascii=False)
                  )

                  for info, name in candidates:
                      with zipfile.ZipFile(io.BytesIO(outer.read(info))) as book:
                          root = ET.fromstring(book.read("xl/workbook.xml"))
                          sheets = [
                              sheet.attrib.get("name", "")
                              for sheet in root.findall(".//m:sheets/m:sheet", NS)
                          ]
                          print(
                              f"=== {label} workbook {name} sheets ===",
                              json.dumps(sheets, ensure_ascii=False)
                          )

          inspect("/tmp/meijo.zip", "MEIJO")
          inspect("/tmp/meiko.zip", "MEIKO")
          PY

      - name: Inspect Sakae M05 raw timetable layout
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          import io
          import json
          import zipfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "extractor",
              Path("scripts/extract-nagoya-subway.py"),
          )
          extractor = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(extractor)

          def col_name(number):
              result = ""
              value = number
              while value:
                  value, rem = divmod(value - 1, 26)
                  result = chr(65 + rem) + result
              return result

          with zipfile.ZipFile("/tmp/meijo.zip") as outer:
              info, recovered = extractor.find_workbook(
                  outer, "M05", "栄"
              )
              print("workbook", recovered)

              with zipfile.ZipFile(io.BytesIO(outer.read(info))) as book:
                  names = extractor.sheet_names(book)

                  for sheet_name in names:
                      sheet_index = names.index(sheet_name) + 1
                      path = f"xl/worksheets/sheet{sheet_index}.xml"
                      cells = extractor.read_sheet_cells(book, path)

                      print(f"=== SHEET {sheet_name} ===")
                      print(
                          "markers",
                          json.dumps(
                              extractor.marker_destinations(cells),
                              ensure_ascii=False,
                          )
                      )

                      for row in range(1, 45):
                          values = [
                              f"{col_name(col)}={extractor.normalize_text(value)}"
                              for (col, cell_row), value in sorted(cells.items())
                              if cell_row == row
                          ]
                          if values:
                              print(f"ROW {row}: " + " | ".join(values))
          PY

      - name: Extract normalized Sakae M05 Meijo timetables
        shell: bash
        run: |
          set -euo pipefail

          MEIJO_URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/e6fb0551-8fba-49fd-b0ef-c2dc5e2444e4/download/20250929_subway-timetable-meijoline.zip'

          python3 scripts/extract-nagoya-subway.py \
            --zip /tmp/meijo.zip \
            --output /tmp/sakae-meijo-right.json \
            --station-code M05 \
            --station-name 栄 \
            --direction-sheet 上り \
            --default-terminal 名城線右回り \
            --revision 2025-09-29 \
            --source-url "$MEIJO_URL"

          python3 scripts/extract-nagoya-subway.py \
            --zip /tmp/meijo.zip \
            --output /tmp/sakae-meijo-left.json \
            --station-code M05 \
            --station-name 栄 \
            --direction-sheet 下り \
            --default-terminal 名城線左回り \
            --revision 2025-09-29 \
            --source-url "$MEIJO_URL"

      - name: Inspect normalized Sakae M05 late departures
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          for path in (
              "/tmp/sakae-meijo-right.json",
              "/tmp/sakae-meijo-left.json",
          ):
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)

              print("===", path, "===")
              print("sheet", data["directionSheet"])
              print("default", data["defaultTerminal"])
              print("markers", json.dumps(data["markerDestinations"], ensure_ascii=False))

              for day_type, departures in data["schedules"].items():
                  late = [
                      d for d in departures
                      if d["serviceMinutes"] >= 22 * 60 + 30
                  ]
                  print(
                      day_type,
                      json.dumps(late[-30:], ensure_ascii=False, indent=2)
                  )
          PY

      - name: Upload inspection ZIP metadata
        uses: actions/upload-artifact@v4
        with:
          name: meijo-meiko-sakae-inspection
          path: |
            /tmp/meijo.zip
            /tmp/meiko.zip
            /tmp/sakae-meijo-right.json
            /tmp/sakae-meijo-left.json
          if-no-files-found: error
          retention-days: 1
