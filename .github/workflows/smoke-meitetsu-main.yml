name: Smoke Meitetsu Main Production

on:
  workflow_run:
    workflows: ["Deploy Worker to Cloudflare"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify deployed build and NH26 boundary
        env:
          BASE_URL: https://ato-ippai-api-poc.edward-se-pg.workers.dev
          EXPECTED_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS "$BASE_URL/health" -o /tmp/health.json
          cat /tmp/health.json

          EXPECTED_BUILD_SHA="$EXPECTED_BUILD_SHA" python3 - <<'PY'
          import json
          import os

          with open('/tmp/health.json', encoding='utf-8') as f:
              health = json.load(f)

          assert health.get('ok') is True, health
          assert health.get('service') == 'ato-ippai-api-poc', health
          assert health.get('buildSha') == os.environ['EXPECTED_BUILD_SHA'], health
          print('Meitetsu smoke build SHA: OK')
          PY

          cat > /tmp/nh26-boundary-request.json <<'JSON'
          {
            "origin": {
              "latitude": 35.1715,
              "longitude": 136.9057
            },
            "departureTime": "2026-09-04T22:30:00+09:00",
            "dayType": "weekday",
            "destinationCode": "NH26",
            "offsetMinutes": [0, 30],
            "stationBufferMinutes": 3,
            "minimumBoardingLeadMinutes": 1
          }
          JSON

          curl -fsS \
            -H "content-type: application/json" \
            --data @/tmp/nh26-boundary-request.json \
            "$BASE_URL/api/last-train-boundary" \
            -o /tmp/nh26-boundary.json

          cat /tmp/nh26-boundary.json

          python3 - <<'PY'
          import json

          with open('/tmp/nh26-boundary.json', encoding='utf-8') as f:
              data = json.load(f)

          scenarios = data['scenarios']

          assert data['routeFound'] is True, data
          assert data['dataSource'] == 'internal_last_train_json', data
          assert data['destination']['code'] == 'NH26', data
          assert data['destination']['name'] == '左京山', data
          assert set(data['walkOptions']) == {'nagoya'}, data['walkOptions']

          assert scenarios[0]['canReachDestination'] is True, scenarios
          assert scenarios[0]['recommendedOriginId'] == 'nagoya', scenarios
          assert scenarios[0]['lastDeparture'] == '23:21', scenarios
          assert scenarios[0]['lastArrival'] == '23:50', scenarios
          assert scenarios[0]['routeSummary'] == '名鉄名古屋本線 普通 直通', scenarios

          assert scenarios[1]['canReachDestination'] is False, scenarios

          print('Meitetsu Main NH26 production smoke: OK')
          PY
