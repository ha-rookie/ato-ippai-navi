name: PoC Routes Evaluate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-routes.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call /api/evaluate
        env:
          BASE_URL: https://ato-ippai-api-poc.edward-se-pg.workers.dev
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/request.json <<'JSON'
          {
            "origin": {
              "latitude": 35.1715,
              "longitude": 136.9057
            },
            "transitDestination": "藤が丘駅 愛知県名古屋市",
            "driveDestination": "藤が丘駅 愛知県名古屋市",
            "departureTime": "2026-09-04T14:20:00Z",
            "offsetMinutes": [0, 15, 30, 60]
          }
          JSON

          echo "Request:"
          cat /tmp/request.json

          curl -fsS             -H "content-type: application/json"             --data @/tmp/request.json             "$BASE_URL/api/evaluate"             -o /tmp/evaluate.json

          echo
          echo "Response:"
          cat /tmp/evaluate.json
          echo

          python3 - <<'PY'
          import json

          with open("/tmp/evaluate.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data.get("baseDepartureTime") == "2026-09-04T14:20:00Z", data
          transit = data.get("transit")
          assert isinstance(transit, list) and len(transit) == 4, data

          print()
          print("=== Summary ===")
          for item in transit:
              print({
                  "offsetMinutes": item.get("offsetMinutes"),
                  "routeFound": item.get("routeFound"),
                  "firstTransitDeparture": item.get("firstTransitDeparture"),
                  "lastTransitArrival": item.get("lastTransitArrival"),
                  "waitMinutes": item.get("waitMinutes"),
                  "lateNightReturnPossible": item.get("lateNightReturnPossible"),
                  "fare": item.get("fare"),
              })

          print("drive:", data.get("drive"))
          PY
