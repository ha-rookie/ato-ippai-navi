name: PoC Routes Transit Controls

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-routes.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Compare Nagoya, Tokyo, New York transit
        env:
          BASE_URL: https://ato-ippai-api-poc.edward-se-pg.workers.dev
        shell: bash
        run: |
          set -euo pipefail

          test_transit () {
            label="$1"
            origin="$2"
            dest="$3"
            departure="$4"

            cat > /tmp/request.json <<JSON
          {
            "origin": $origin,
            "destination": $dest,
            "departureTime": "$departure"
          }
          JSON

            echo
            echo "===== $label / $departure ====="

            curl -fsS               -H "content-type: application/json"               --data @/tmp/request.json               "$BASE_URL/api/transit"               -o "/tmp/$label.json"

            cat "/tmp/$label.json"
            echo
          }

          # Nagoya: Sakae -> Fujigaoka, 12:00 JST
          test_transit             "nagoya"             '{"latitude":35.1707,"longitude":136.9087}'             '{"latitude":35.1822,"longitude":137.0216}'             "2026-09-02T03:00:00Z"

          # Tokyo Station -> Shinjuku Station, 12:00 JST
          test_transit             "tokyo"             '{"latitude":35.681236,"longitude":139.767125}'             '{"latitude":35.690921,"longitude":139.700258}'             "2026-09-02T03:00:00Z"

          # Times Square -> Grand Central, 08:00 EDT
          test_transit             "newyork"             '{"latitude":40.7580,"longitude":-73.9855}'             '{"latitude":40.7527,"longitude":-73.9772}'             "2026-09-02T12:00:00Z"

          python3 - <<'PY'
          import json

          print("=== Control summary ===")
          for label in ["nagoya", "tokyo", "newyork"]:
              with open(f"/tmp/{label}.json", encoding="utf-8") as f:
                  data = json.load(f)

              print(label, {
                  "routeFound": data.get("routeFound"),
                  "rawRouteCount": data.get("rawRouteCount"),
                  "firstTransitDeparture": data.get("firstTransitDeparture"),
                  "lastTransitArrival": data.get("lastTransitArrival"),
                  "waitMinutes": data.get("waitMinutes"),
                  "fare": data.get("fare"),
              })
          PY
