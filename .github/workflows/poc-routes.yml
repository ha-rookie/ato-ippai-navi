name: PoC Routes Transit Isolation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-routes.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Test transit with fixed station coordinates
        env:
          BASE_URL: https://ato-ippai-api-poc.edward-se-pg.workers.dev
        shell: bash
        run: |
          set -euo pipefail

          ORIGIN='{"latitude":35.1707,"longitude":136.9087}'
          DEST='{"latitude":35.1822,"longitude":137.0216}'

          test_transit () {
            label="$1"
            departure="$2"

            cat > /tmp/request.json <<JSON
          {
            "origin": $ORIGIN,
            "destination": $DEST,
            "departureTime": "$departure"
          }
          JSON

            echo
            echo "===== $label / $departure ====="

            curl -fsS               -H "content-type: application/json"               --data @/tmp/request.json               "$BASE_URL/api/transit"               -o "/tmp/$label.json"

            cat "/tmp/$label.json"
            echo
          }

          # 2026-09-02 JST
          test_transit "daytime" "2026-09-02T03:00:00Z"
          test_transit "night2200" "2026-09-02T13:00:00Z"
          test_transit "night2300" "2026-09-02T14:00:00Z"

          python3 - <<'PY'
          import json

          print("=== Isolation summary ===")
          for label in ["daytime", "night2200", "night2300"]:
              with open(f"/tmp/{label}.json", encoding="utf-8") as f:
                  data = json.load(f)

              print(label, {
                  "routeFound": data.get("routeFound"),
                  "rawRouteCount": data.get("rawRouteCount"),
                  "firstTransitDeparture": data.get("firstTransitDeparture"),
                  "lastTransitArrival": data.get("lastTransitArrival"),
                  "waitMinutes": data.get("waitMinutes"),
                  "fare": data.get("fare"),
              })
          PY
