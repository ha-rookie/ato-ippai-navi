name: PoC Meitetsu Chikko Oe Transfer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/poc-meitetsu-chikko-oe-transfer.py'
      - '.github/workflows/poc-meitetsu-chikko-oe-transfer.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve representative service dates
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo('Asia/Tokyo')).date()
          weekday = today
          while weekday.weekday() >= 5:
              weekday += timedelta(days=1)
          saturday = today + timedelta(days=(5 - today.weekday()) % 7)
          print(f'MEITETSU_WEEKDAY_DATE={weekday.isoformat()}')
          print(f'MEITETSU_HOLIDAY_DATE={saturday.isoformat()}')
          PY

      - name: Download official Meitetsu timetable sources
        shell: bash
        run: |
          set -euo pipefail

          BASE='https://trainbus.meitetsu.co.jp/meitetsu-transfer/pc'
          COOKIE_JAR=/tmp/meitetsu-chikko-cookies.txt
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'

          fetch() {
            local url="$1"
            local output="$2"
            echo "GET $url"
            curl --fail --silent --show-error --location --compressed \
              --retry 2 --retry-delay 1 \
              --user-agent "$UA" \
              --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
              --referer 'https://www.meitetsu.co.jp/' \
              --cookie "$COOKIE_JAR" --cookie-jar "$COOKIE_JAR" \
              "$url" -o "$output"
            test -s "$output"
          }

          fetch "$BASE/map/Top?window=transfer" /tmp/meitetsu-chikko-top.html

          # Static station timetable is diagnostic only because the official page
          # marks Chikko services with irregular/operation-date notices.
          fetch \
            "$BASE/diagram/TrainDiagram?direction=down&linkId=00000875&startId=00005590" \
            /tmp/meitetsu-chikko-oe-timetable.html

          declare -A DATES=(
            [weekday]="$MEITETSU_WEEKDAY_DATE"
            [saturday_holiday]="$MEITETSU_HOLIDAY_DATE"
          )

          for day_type in weekday saturday_holiday; do
            # No-transfer query proves NH36 -> CH01 is not a direct service.
            fetch \
              "$BASE/transfer/DepArrTimeList?date=${DATES[$day_type]}&gnode=00006856&snode=00004372" \
              "/tmp/meitetsu-chikko-through-${day_type}.html"

            # Each concrete leg is read from the official destination-specific
            # no-transfer timetable. This avoids reverse-engineering undocumented
            # date controls in the transfer solver.
            fetch \
              "$BASE/transfer/DepArrTimeList?date=${DATES[$day_type]}&gnode=00006856&snode=00005590" \
              "/tmp/meitetsu-chikko-shuttle-${day_type}.html"

            fetch \
              "$BASE/transfer/DepArrTimeList?date=${DATES[$day_type]}&gnode=00005590&snode=00004372" \
              "/tmp/meitetsu-chikko-feeder-${day_type}.html"
          done

      - name: Generate and validate transfer boundary
        run: python3 scripts/poc-meitetsu-chikko-oe-transfer.py

      - name: Validate station identity and conservative connection
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          with open('/tmp/meitetsu-chikko-transfer-poc.json', encoding='utf-8') as f:
              data = json.load(f)

          assert data['origin'] == {
              'code': 'NH36', 'name': '名鉄名古屋', 'nodeId': '00004372'
          }
          assert data['transfer'] == {
              'code': 'TA03', 'name': '大江', 'nodeId': '00005590'
          }
          assert data['destination'] == {
              'code': 'CH01', 'name': '東名古屋港', 'nodeId': '00006856'
          }
          assert data['minimumTransferLeadMinutes'] == 3
          assert data['staticTimetable']['identityOk'] is True
          assert data['staticTimetable']['containsIrregularNotice'] is True
          assert data['staticTimetable']['containsOperationDateNotice'] is True

          expected = {
              'weekday': ('19:25', '19:36', '19:44', '19:47', 8),
              'saturday_holiday': ('16:55', '17:06', '17:20', '17:23', 14),
          }

          for day_type, values in expected.items():
              day = data['days'][day_type]
              boundary = day['boundary']
              dep, ready, connection, arrival, margin = values

              assert day['throughSearch']['identity']['originPresent'] is True
              assert day['throughSearch']['identity']['destinationPresent'] is True
              assert day['throughSearch']['parsedRowCount'] == 0
              assert day['shuttleServiceCount'] >= 1
              assert day['feederServiceCount'] >= 1
              assert boundary['lastDeparture'] == dep
              assert boundary['transferReadyTime'] == ready
              assert boundary['connectionDeparture'] == connection
              assert boundary['lastArrival'] == arrival
              assert boundary['transferMarginMinutes'] == margin
              assert boundary['minimumTransferLeadMinutes'] == 3
              assert margin >= boundary['minimumTransferLeadMinutes']
              assert boundary['feeder']['routeNames'] == ['名古屋本線(急行)']
              assert boundary['feeder']['terminals'] == ['河和']
              assert boundary['shuttle']['routeNames'] == ['築港線(普通)']
              assert boundary['shuttle']['terminals'] == ['東名古屋港']

          print('Meitetsu Chikko CH01 conservative transfer validation: OK')
          PY

      - name: Show PoC JSON summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/meitetsu-chikko-transfer-poc.json ]; then
            python3 - <<'PY'
          import json
          with open('/tmp/meitetsu-chikko-transfer-poc.json', encoding='utf-8') as f:
              data = json.load(f)
          print(json.dumps({
              'minimumTransferLeadMinutes': data['minimumTransferLeadMinutes'],
              'verificationStrategy': data['verificationStrategy'],
              'staticTimetable': {
                  'identityOk': data['staticTimetable']['identityOk'],
                  'containsIrregularNotice': data['staticTimetable']['containsIrregularNotice'],
                  'containsOperationDateNotice': data['staticTimetable']['containsOperationDateNotice'],
              },
              'days': {
                  day_type: {
                      'boundary': day['boundary'],
                      'compatibleFeederCount': day['compatibleFeederCount'],
                      'tooTightFeederCount': day['tooTightFeederCount'],
                      'throughSearch': day['throughSearch'],
                  }
                  for day_type, day in data['days'].items()
              }
          }, ensure_ascii=False, indent=2))
          PY
          fi

      - name: Upload PoC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meitetsu-chikko-oe-transfer-poc
          if-no-files-found: warn
          path: |
            /tmp/meitetsu-chikko-*.html
            /tmp/meitetsu-chikko-transfer-poc.json
