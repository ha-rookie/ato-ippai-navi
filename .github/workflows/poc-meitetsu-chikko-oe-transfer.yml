name: PoC Meitetsu Chikko Oe Transfer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/poc-meitetsu-chikko-oe-transfer.py'
      - '.github/workflows/poc-meitetsu-chikko-oe-transfer.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve representative service dates
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo('Asia/Tokyo')).date()
          weekday = today
          while weekday.weekday() >= 5:
              weekday += timedelta(days=1)
          saturday = today + timedelta(days=(5 - today.weekday()) % 7)
          print(f'MEITETSU_WEEKDAY_DATE={weekday.isoformat()}')
          print(f'MEITETSU_HOLIDAY_DATE={saturday.isoformat()}')
          PY

      - name: Download official Meitetsu sources
        shell: bash
        run: |
          set -euo pipefail

          BASE='https://trainbus.meitetsu.co.jp/meitetsu-transfer/pc'
          COOKIE_JAR=/tmp/meitetsu-chikko-cookies.txt
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'

          fetch() {
            local url="$1"
            local output="$2"
            echo "GET $url"
            curl --fail --silent --show-error --location --compressed \
              --retry 2 --retry-delay 1 \
              --user-agent "$UA" \
              --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
              --referer 'https://www.meitetsu.co.jp/' \
              --cookie "$COOKIE_JAR" --cookie-jar "$COOKIE_JAR" \
              "$url" -o "$output"
            test -s "$output"
          }

          fetch "$BASE/map/Top?window=transfer" /tmp/meitetsu-chikko-top.html

          # Static Oe -> Higashi-Nagoyako timetable. Used to detect irregular-service notices.
          fetch \
            "$BASE/diagram/TrainDiagram?direction=down&linkId=00000875&startId=00005590" \
            /tmp/meitetsu-chikko-oe-timetable.html

          declare -A DATES=(
            [weekday]="$MEITETSU_WEEKDAY_DATE"
            [saturday_holiday]="$MEITETSU_HOLIDAY_DATE"
          )

          for day_type in weekday saturday_holiday; do
            # Whole journey. This is intentionally inspected first because CH01 requires Oe transfer.
            fetch \
              "$BASE/transfer/DepArrTimeList?date=${DATES[$day_type]}&gnode=00006856&snode=00004372" \
              "/tmp/meitetsu-chikko-through-${day_type}.html"

            # Transfer leg only.
            fetch \
              "$BASE/transfer/DepArrTimeList?date=${DATES[$day_type]}&gnode=00006856&snode=00005590" \
              "/tmp/meitetsu-chikko-shuttle-${day_type}.html"
          done

      - name: Inspect transfer HTML structure
        run: python3 scripts/poc-meitetsu-chikko-oe-transfer.py

      - name: Validate station identity and source shape
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          with open('/tmp/meitetsu-chikko-transfer-poc.json', encoding='utf-8') as f:
              data = json.load(f)

          assert data['origin'] == {
              'code': 'NH36', 'name': '名鉄名古屋', 'nodeId': '00004372'
          }
          assert data['transfer'] == {
              'code': 'TA03', 'name': '大江', 'nodeId': '00005590'
          }
          assert data['destination'] == {
              'code': 'CH01', 'name': '東名古屋港', 'nodeId': '00006856'
          }
          assert data['staticTimetable']['identityOk'] is True
          assert data['staticTimetable']['containsIrregularNotice'] is True

          for day_type in ('weekday', 'saturday_holiday'):
              day = data['days'][day_type]
              assert day['shuttleServiceCount'] >= 1, day_type
              last = day['lastShuttle']
              assert last['departure'], day_type
              assert last['arrival'], day_type
              assert any(name.startswith('築港線(') for name in last['routeNames']), (day_type, last)
              assert day['throughSearch']['identity']['originPresent'] is True
              assert day['throughSearch']['identity']['destinationPresent'] is True

          print('Meitetsu Chikko CH01 source-shape validation: OK')
          PY

      - name: Show PoC JSON summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/meitetsu-chikko-transfer-poc.json ]; then
            python3 - <<'PY'
          import json
          with open('/tmp/meitetsu-chikko-transfer-poc.json', encoding='utf-8') as f:
              data = json.load(f)
          print(json.dumps({
              'staticTimetable': data['staticTimetable'],
              'days': {
                  day_type: {
                      'lastShuttle': day['lastShuttle'],
                      'throughSearch': {
                          'identity': day['throughSearch']['identity'],
                          'timeDetailBlockCount': day['throughSearch']['timeDetailBlockCount'],
                          'parsedRowCount': day['throughSearch']['parsedRowCount'],
                          'lastRows': day['throughSearch']['rows'][-5:],
                      }
                  }
                  for day_type, day in data['days'].items()
              }
          }, ensure_ascii=False, indent=2))
          PY
          fi

      - name: Upload PoC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meitetsu-chikko-oe-transfer-poc
          if-no-files-found: warn
          path: |
            /tmp/meitetsu-chikko-*.html
            /tmp/meitetsu-chikko-transfer-poc.json
