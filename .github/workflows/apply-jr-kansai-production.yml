name: Apply JR Kansai Production

on:
  push:
    branches: [feat/jr-kansai-nagoya]
    paths:
      - 'scripts/apply-jr-kansai-production.py'
      - '.github/workflows/apply-jr-kansai-production.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/jr-kansai-nagoya

      - name: Apply migration
        run: python3 scripts/apply-jr-kansai-production.py

      - name: Commit generated production changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/data/last-trains-nagoya.json \
            public/index.html \
            public/js/settings.js \
            test/settings.test.js \
            test/last-train.test.js \
            scripts/generate-jr-kansai-nagoya-last-trains.py \
            .github/workflows/poc-jr-kansai-nagoya.yml \
            .github/workflows/deploy-worker.yml
          git commit -m 'feat: add JR Kansai Nagoya production support'
          git push origin HEAD:feat/jr-kansai-nagoya
