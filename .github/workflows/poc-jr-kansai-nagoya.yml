name: PoC JR Kansai Nagoya

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-jr-kansai-nagoya.yml'
      - 'scripts/generate-jr-kansai-nagoya-last-trains.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PDF text tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils

      - name: Download official JR Central sources
        shell: bash
        run: |
          set -euo pipefail

          TIMETABLE_URL='https://railway.jr-central.co.jp/time-schedule/srch/_pdf/data/202603/kansai_Nagoya_B_wh_d.pdf'
          NUMBERING_URL='https://global.jr-central.co.jp/en/info/railwaymap/_pdf/railwaymap.pdf'

          curl -fsSL "$TIMETABLE_URL" -o /tmp/jr-kansai-nagoya.pdf
          curl -fsSL "$NUMBERING_URL" -o /tmp/jr-station-numbering.pdf

          test -s /tmp/jr-kansai-nagoya.pdf
          test -s /tmp/jr-station-numbering.pdf

      - name: Convert official PDFs to layout text
        shell: bash
        run: |
          set -euo pipefail

          pdftotext -layout /tmp/jr-kansai-nagoya.pdf /tmp/jr-kansai-nagoya.txt
          pdftotext -layout /tmp/jr-station-numbering.pdf /tmp/jr-station-numbering.txt

          test -s /tmp/jr-kansai-nagoya.txt
          test -s /tmp/jr-station-numbering.txt

      - name: Inspect Nagoya late-night timetable
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/jr-kansai-nagoya.txt').read_text(encoding='utf-8')
          normalized = re.sub(r'[ \t]+', ' ', text)
          lines = text.splitlines()

          required = ['関西線時刻表', '名古屋', '八田', '春田', '四日市', '普通']
          for token in required:
              assert token in text, f'missing timetable token: {token}'

          print('==== JR Kansai Nagoya 23:00 block ====')
          anchors = [
              index for index, line in enumerate(lines)
              if re.search(r'^\s*23\s+11\b', line)
          ]
          assert anchors, '23:00 row anchor not found'

          for anchor in anchors:
              for line in lines[max(0, anchor - 3):min(len(lines), anchor + 10)]:
                  print(line)
              print('---')

          # Current official 2026-03 PDF has the same late-night boundary
          # on weekdays and Saturdays/Sundays/holidays: 23:57 local to Yokkaichi.
          assert normalized.count('11 25 40 57') >= 2, 'late-night minute row changed'
          assert '四日市' in normalized
          assert '普通' in normalized

          print('JR Kansai Nagoya late-night structure inspection: OK')
          PY

      - name: Inspect official station numbering
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/jr-station-numbering.txt').read_text(encoding='utf-8')
          compact = re.sub(r'\s+', ' ', text)

          print('==== JR Central railway-map CJ excerpts ====')
          lines = text.splitlines()
          for index, line in enumerate(lines):
              if 'CJ' in line or 'Kansai Line' in line or 'Nagoya' in line or 'Hatta' in line or 'Haruta' in line:
                  for excerpt in lines[max(0, index - 1):min(len(lines), index + 2)]:
                      print(excerpt)
                  print('---')

          # The current official railway map is machine-readable enough to
          # validate the three Nagoya-city Kansai Line station-number anchors.
          for code in ('CJ00', 'CJ01', 'CJ02'):
              assert code in compact, f'missing station number: {code}'
          for station in ('Nagoya', 'Hatta', 'Haruta'):
              assert station in compact, f'missing station name: {station}'

          print('JR Central CJ00/CJ01/CJ02 station-number inspection: OK')
          PY

      - name: Upload official PoC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jr-kansai-nagoya-poc
          path: |
            /tmp/jr-kansai-nagoya.txt
            /tmp/jr-station-numbering.txt
          if-no-files-found: error
          retention-days: 7
