name: Verify Meitetsu Tokoname Nagoya

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-meitetsu-tokoname-nagoya.yml'
      - 'scripts/poc-meitetsu-tokoname-nagoya.py'
      - 'src/data/last-trains-nagoya.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve representative service dates
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo('Asia/Tokyo')).date()
          weekday = today
          while weekday.weekday() >= 5:
              weekday += timedelta(days=1)
          saturday = today + timedelta(days=(5 - today.weekday()) % 7)
          print(f'MEITETSU_WEEKDAY_DATE={weekday.isoformat()}')
          print(f'MEITETSU_HOLIDAY_DATE={saturday.isoformat()}')
          PY

      - name: Download official Meitetsu direct timetable sources
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://trainbus.meitetsu.co.jp/meitetsu-transfer/pc'
          COOKIE_JAR=/tmp/meitetsu-tokoname-cookies.txt
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'

          fetch() {
            local url="$1"
            local output="$2"
            echo "GET $url"
            curl --fail --silent --show-error --location --compressed \
              --retry 2 --retry-delay 1 \
              --user-agent "$UA" \
              --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
              --referer 'https://www.meitetsu.co.jp/' \
              --cookie "$COOKIE_JAR" --cookie-jar "$COOKIE_JAR" \
              "$url" -o "$output"
            test -s "$output"
          }

          fetch "$BASE/map/Top?window=transfer" /tmp/meitetsu-tokoname-top.html

          declare -A NODES=(
            [TA01]=00008244
            [TA02]=00006970
            [TA03]=00005590
            [TA04]=00005732
            [TA05]=00003410
          )

          for code in TA01 TA02 TA03 TA04 TA05; do
            fetch \
              "$BASE/transfer/DepArrTimeList?date=$MEITETSU_WEEKDAY_DATE&gnode=${NODES[$code]}&snode=00004372" \
              "/tmp/meitetsu-tokoname-${code}-weekday.html"
            fetch \
              "$BASE/transfer/DepArrTimeList?date=$MEITETSU_HOLIDAY_DATE&gnode=${NODES[$code]}&snode=00004372" \
              "/tmp/meitetsu-tokoname-${code}-saturday_holiday.html"
          done

      - name: Generate official TA01-TA05 boundaries
        run: python3 scripts/poc-meitetsu-tokoname-nagoya.py

      - name: Compare official boundaries with production JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          nodes = {
              'TA01': ('豊田本町', '00008244'),
              'TA02': ('道徳', '00006970'),
              'TA03': ('大江', '00005590'),
              'TA04': ('大同町', '00005732'),
              'TA05': ('柴田', '00003410'),
          }

          with open('/tmp/meitetsu-tokoname-last-trains.json', encoding='utf-8') as f:
              official = json.load(f)
          with open('src/data/last-trains-nagoya.json', encoding='utf-8') as f:
              production = json.load(f)

          assert official['origin'] == {
              'code': 'NH36', 'name': '名鉄名古屋', 'nodeId': '00004372'
          }

          for code, (name, node_id) in nodes.items():
              generated = official['destinations'][code]
              stored = production['destinations'][code]
              assert generated['name'] == name, code
              assert generated['officialNodeId'] == node_id, code
              assert stored['name'] == name, code
              assert stored['operator'] == 'meitetsu', code
              assert stored['line'] == 'tokoname', code
              assert stored['officialStationCode'] == code, code

              for day_type in ('weekday', 'saturday_holiday'):
                  g = generated['routes'][day_type]
                  p = stored['routes']['nagoya'][day_type]
                  assert len(g['routeNames']) == 1, (code, day_type, g['routeNames'])
                  assert g['routeNames'][0].startswith('名古屋本線('), (code, day_type, g)
                  assert len(g['trainClasses']) == 1, (code, day_type, g['trainClasses'])
                  train_class = g['trainClasses'][0]
                  assert p['lastDeparture'] == g['lastDeparture'], (code, day_type)
                  assert p['lastArrival'] == g['lastArrival'], (code, day_type)
                  assert p['trainClass'] == train_class, (code, day_type)
                  assert p['trainTerminal'] == g['trainTerminal'], (code, day_type)
                  assert p['routeSummary'] == f'名鉄名古屋本線→常滑線 {train_class} 直通', (code, day_type)
                  assert p['transfers'] == 0, (code, day_type)
                  assert p['status'] == 'verified', (code, day_type)
                  assert p['sourceIds'] == ['meitetsu-tokoname-official-direct-timetable'], (code, day_type)

          print('Meitetsu Tokoname official-source production comparison: OK')
          PY

      - name: Show boundary summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/meitetsu-tokoname-last-trains.json ]; then
            python3 - <<'PY'
          import json
          with open('/tmp/meitetsu-tokoname-last-trains.json', encoding='utf-8') as f:
              data = json.load(f)
          for code, destination in data['destinations'].items():
              w = destination['routes']['weekday']
              h = destination['routes']['saturday_holiday']
              print(
                  f'{code} {destination["name"]}: '
                  f'weekday {w["lastDeparture"]}->{w["lastArrival"]} {w["trainClasses"]} {w["trainTerminal"]} / '
                  f'holiday {h["lastDeparture"]}->{h["lastArrival"]} {h["trainClasses"]} {h["trainTerminal"]}'
              )
          PY
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meitetsu-tokoname-nagoya-official
          if-no-files-found: warn
          path: |
            /tmp/meitetsu-tokoname-top.html
            /tmp/meitetsu-tokoname-*.html
            /tmp/meitetsu-tokoname-last-trains.json
            /tmp/meitetsu-tokoname-route-diagnostics.json
            /tmp/meitetsu-tokoname-*-diagnostics.json
