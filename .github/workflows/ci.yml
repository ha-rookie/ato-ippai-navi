name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/last-train.js
          node --check public/app.js
          node --check public/js/sleep.js
          node --check public/js/settings.js

      - name: Run unit tests
        run: npm test
