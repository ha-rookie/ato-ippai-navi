name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/last-train.js
          node --check src/ops-csv.js
          node --check functions/[[path]].js
          node --check public/app.js
          node --check public/js/sleep.js
          node --check public/js/settings.js

      - name: Validate operations scripts
        run: |
          python3 -m py_compile scripts/dispatch-workflow-and-wait.py
          python3 -m json.tool ops/weekly-verifiers.json > /dev/null

      - name: Run unit tests
        run: npm test
