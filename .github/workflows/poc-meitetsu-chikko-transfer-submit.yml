name: PoC Meitetsu Chikko Transfer Submit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-meitetsu-chikko-transfer-submit.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Probe official TransferSearch result contract
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://trainbus.meitetsu.co.jp/meitetsu-transfer/pc'
          COOKIE=/tmp/meitetsu-chikko-submit-cookies.txt
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'

          request() {
            local label="$1"
            shift
            local output="/tmp/${label}.html"
            local headers="/tmp/${label}.headers"
            set +e
            status=$(curl --silent --show-error --location --compressed \
              --user-agent "$UA" \
              --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
              --referer "$BASE/map/Top?window=transfer" \
              --cookie "$COOKIE" --cookie-jar "$COOKIE" \
              --dump-header "$headers" \
              --get "$BASE/transfer/TransferSearch" \
              --data-urlencode 'defaultCondition=0' \
              --data-urlencode 'start=00004372' \
              --data-urlencode 'goal=00006856' \
              --data-urlencode 'orvName=名鉄名古屋' \
              --data-urlencode 'dnvName=東名古屋港(CH01)' \
              "$@" \
              --output "$output" \
              --write-out '%{http_code}')
            rc=$?
            set -e
            echo "$label curl_rc=$rc http=$status bytes=$(wc -c < "$output" 2>/dev/null || echo 0)"

            LABEL="$label" OUTPUT="$output" python3 - <<'PY'
          import html, os, re
          from pathlib import Path
          p=Path(os.environ['OUTPUT'])
          if not p.exists():
              print(os.environ['LABEL'], 'no body')
              raise SystemExit(0)
          raw=p.read_bytes()
          text=None
          for enc in ('utf-8','cp932','shift_jis'):
              try:
                  text=raw.decode(enc); break
              except UnicodeDecodeError: pass
          if text is None:
              text=raw.decode('utf-8','replace')
          plain=re.sub(r'<script.*?</script>|<style.*?</style>', ' ', text, flags=re.I|re.S)
          plain=re.sub(r'<[^>]+>', ' ', plain)
          plain=re.sub(r'\s+', ' ', html.unescape(plain)).strip()
          date_line=re.search(r'20\d{2}年\d{1,2}月\d{1,2}日\s*\d{1,2}時\d{1,2}分\s*(?:出発|到着)', plain)
          routes=re.findall(r'(\d{1,2}:\d{2})\s*発\s*⇒\s*(\d{1,2}:\d{2})\s*着.*?乗換[:：]\s*(\d+)回', plain)
          print('dateLine=', date_line.group(0) if date_line else None)
          print('identity=', {'名鉄名古屋': '名鉄名古屋' in plain, '東名古屋港': '東名古屋港' in plain, '大江': '大江' in plain})
          print('routes=', routes[:6])
          print('contains築港線=', '築港線' in plain, 'contains19:25=', '19:25' in plain, 'contains19:44=', '19:44' in plain, 'contains16:55=', '16:55' in plain, 'contains17:20=', '17:20' in plain)
          print('title=', re.findall(r'<title[^>]*>(.*?)</title>', text, flags=re.I|re.S)[:1])
          PY
          }

          curl --fail --silent --show-error --location --compressed \
            --user-agent "$UA" \
            --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
            --referer 'https://www.meitetsu.co.jp/' \
            --cookie "$COOKIE" --cookie-jar "$COOKIE" \
            "$BASE/map/Top?window=transfer" -o /tmp/top.html

          request minimal

          for spec in 'weekday 2026/9 07 19 47' 'holiday 2026/9 05 17 23'; do
            read -r day_label month day hour minute <<< "$spec"
            for basis in 0 1 2 3 4; do
              request "solver-${day_label}-basis${basis}" \
                --data-urlencode "month=$month" \
                --data-urlencode "day=$day" \
                --data-urlencode "hour=$hour" \
                --data-urlencode "minute=$minute" \
                --data-urlencode "basis=$basis" \
                --data-urlencode 'sort=2' \
                --data-urlencode 'method=1' \
                --data-urlencode 'utrexprs=' \
                --data-urlencode 'wspeed=standard' \
                --data-urlencode 'retFlg=on'
            done
          done

      - name: Upload submit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meitetsu-chikko-transfer-submit
          path: |
            /tmp/minimal.html
            /tmp/minimal.headers
            /tmp/solver-*.html
            /tmp/solver-*.headers
