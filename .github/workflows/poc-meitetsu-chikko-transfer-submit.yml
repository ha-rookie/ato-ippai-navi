name: PoC Meitetsu Chikko Transfer Submit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-meitetsu-chikko-transfer-submit.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inspect official TransferSearchSelect form
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://trainbus.meitetsu.co.jp/meitetsu-transfer/pc'
          COOKIE=/tmp/select.cookies
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'

          curl --fail --silent --show-error --location --compressed \
            --user-agent "$UA" \
            --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
            --referer 'https://www.meitetsu.co.jp/' \
            --cookie "$COOKIE" --cookie-jar "$COOKIE" \
            "$BASE/map/Top?window=transfer" -o /tmp/top.html

          fetch_select() {
            local label="$1" month="$2" day="$3" hour="$4" minute="$5" basis="$6"
            curl --fail --silent --show-error --location --compressed \
              --user-agent "$UA" \
              --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
              --referer "$BASE/map/Top?window=transfer" \
              --cookie "$COOKIE" --cookie-jar "$COOKIE" \
              --get "$BASE/transfer/TransferSearchSelect" \
              --data-urlencode 'orvName=名鉄名古屋' \
              --data-urlencode 'dnvName=東名古屋港(CH01)' \
              --data-urlencode "month=$month" \
              --data-urlencode "day=$day" \
              --data-urlencode "hour=$hour" \
              --data-urlencode "minute=$minute" \
              --data-urlencode "basis=$basis" \
              --data-urlencode 'sort=2' \
              --data-urlencode 'method=0' \
              --data-urlencode 'retFlg=on' \
              --data-urlencode 'utrexprs=' \
              --data-urlencode 'wspeed=standard' \
              -o "/tmp/${label}.html"

            LABEL="$label" python3 - <<'PY'
          import html, os, re
          from pathlib import Path
          label=os.environ['LABEL']
          text=Path(f'/tmp/{label}.html').read_text(encoding='utf-8', errors='replace')
          plain=re.sub(r'<script.*?</script>|<style.*?</style>', ' ', text, flags=re.I|re.S)
          plain=re.sub(r'<[^>]+>', ' ', plain)
          plain=re.sub(r'\s+', ' ', html.unescape(plain)).strip()
          print(label, 'bytes=', len(text), 'title=', re.findall(r'<title[^>]*>(.*?)</title>', text, flags=re.I|re.S)[:1])
          print('identity=', {'名鉄名古屋': '名鉄名古屋' in plain, '東名古屋港': '東名古屋港' in plain})
          for i, form in enumerate(re.findall(r'<form\b.*?</form>', text, flags=re.I|re.S)):
              tag=re.search(r'<form\b[^>]*>', form, flags=re.I)
              print('FORM', i, tag.group(0) if tag else None)
              for name,value in re.findall(r'<input[^>]+name="([^"]+)"[^>]*value="([^"]*)"', form, flags=re.I):
                  if name in {'orvNode','dnvNode','orvName','dnvName','month','day','hour','minute','basis','sort','method','retFlg','wspeed','utrexprs','start','goal'}:
                      print(' INPUT', name, html.unescape(value))
              for name,body in re.findall(r'<select[^>]+name="([^"]+)"[^>]*>(.*?)</select>', form, flags=re.I|re.S):
                  if name in {'orvNode','dnvNode','month','day','hour','minute'}:
                      opts=[]
                      for value,label_text in re.findall(r'<option[^>]*value="([^"]*)"[^>]*>(.*?)</option>', body, flags=re.I|re.S):
                          cleaned=re.sub(r'<[^>]+>',' ',html.unescape(label_text)); cleaned=re.sub(r'\s+',' ',cleaned).strip()
                          if '名鉄名古屋' in cleaned or '東名古屋港' in cleaned or 'NH36' in cleaned or 'CH01' in cleaned:
                              opts.append((html.unescape(value), cleaned))
                      if opts: print(' SELECT', name, opts)
          PY
          }

          fetch_select weekday-arrive 2026/09 07 19 47 0
          fetch_select weekday-depart 2026/09 07 19 47 1

      - name: Upload submit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meitetsu-chikko-transfer-submit
          path: |
            /tmp/weekday-*.html
