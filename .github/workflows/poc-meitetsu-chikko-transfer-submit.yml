name: PoC Meitetsu Chikko Transfer Submit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-meitetsu-chikko-transfer-submit.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Re-search transfer inside official result session
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://trainbus.meitetsu.co.jp/meitetsu-transfer'
          PC="$ROOT/pc"
          SMART="$ROOT/smart"
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'

          probe() {
            local label="$1" target_day="$2" hour="$3" minute="$4"
            local cookie="/tmp/${label}.cookies"
            local seed="/tmp/${label}-seed-result.html"
            local result="/tmp/${label}-research-result.html"

            # First establish the exact origin/destination result session using the
            # official canonical endpoint. The rendered page owns the `research` form.
            curl --fail --silent --show-error --location --compressed \
              --user-agent "$UA" \
              --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
              --referer 'https://www.meitetsu.co.jp/' \
              --cookie "$cookie" --cookie-jar "$cookie" \
              --get "$PC/transfer/TransferSearch" \
              --data-urlencode 'defaultCondition=0' \
              --data-urlencode 'start=00004372' \
              --data-urlencode 'goal=00006856' \
              --data-urlencode 'orvName=名鉄名古屋' \
              --data-urlencode 'dnvName=東名古屋港(CH01)' \
              -o "$seed"

            grep -q 'id="research"' "$seed"
            grep -q 'name="day"' "$seed"
            grep -q 'name="orvName" value="名鉄名古屋"' "$seed"
            grep -q 'name="dnvName" value="東名古屋港(CH01)"' "$seed"

            # Then replay the page's own GET research form in the SAME session.
            curl --fail --silent --show-error --location --compressed \
              --user-agent "$UA" \
              --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
              --referer "$PC/transfer/TransferSearch?defaultCondition=0&start=00004372&goal=00006856" \
              --cookie "$cookie" --cookie-jar "$cookie" \
              --get "$SMART/top/Top" \
              --data-urlencode 'orvName=名鉄名古屋' \
              --data-urlencode 'dnvName=東名古屋港(CH01)' \
              --data-urlencode 'orvCode=' \
              --data-urlencode 'dnvCode=' \
              --data-urlencode "day=$target_day" \
              --data-urlencode "hour=$hour" \
              --data-urlencode "minute=$minute" \
              --data-urlencode 'sort=2' \
              --data-urlencode 'basis=0' \
              --data-urlencode 'method=0' \
              --data-urlencode 'wspeed=standard' \
              --data-urlencode 'utrexprs=' \
              --data-urlencode 'useRomancecar=false' \
              --data-urlencode 'unuse=' \
              --data-urlencode 'from=research' \
              --data-urlencode 'research=1' \
              -D "/tmp/${label}-research.headers" \
              -o "$result"

            LABEL="$label" RESULT="$result" TARGET_DAY="$target_day" python3 - <<'PY'
          import html, os, re
          from pathlib import Path
          text=Path(os.environ['RESULT']).read_text(encoding='utf-8', errors='replace')
          plain=re.sub(r'<script.*?</script>|<style.*?</style>', ' ', text, flags=re.I|re.S)
          plain=re.sub(r'<[^>]+>', ' ', plain)
          plain=re.sub(r'\s+', ' ', html.unescape(plain)).strip()
          print(os.environ['LABEL'], 'bytes=', len(text))
          print('title=', re.findall(r'<title[^>]*>(.*?)</title>', text, flags=re.I|re.S)[:1])
          print('dateLines=', re.findall(r'20\d{2}年\d{1,2}月\d{1,2}日\s*\d{1,2}時\d{1,2}分\s*(?:出発|到着)', plain)[:4])
          print('identity=', {'名鉄名古屋': '名鉄名古屋' in plain, '東名古屋港': '東名古屋港' in plain, '大江': '大江' in plain})
          print('targets=', {t: t in plain for t in ('19:25','19:36','19:44','19:47','16:55','17:06','17:20','17:23')})
          print('transfer1=', bool(re.search(r'乗換\s*1\s*回', plain)))
          print('researchDay=', re.findall(r'name="day"\s+value="(\d{8})"', text)[:2])
          PY
          }

          probe weekday 20260907 19 47
          probe holiday 20260905 17 23

      - name: Upload submit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meitetsu-chikko-transfer-submit
          path: |
            /tmp/weekday-*.html
            /tmp/weekday-*.headers
            /tmp/holiday-*.html
            /tmp/holiday-*.headers
