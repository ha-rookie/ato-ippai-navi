name: PoC Meitetsu Seto Sakaemachi

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-meitetsu-seto-sakaemachi.yml'
      - 'scripts/generate-meitetsu-seto-last-trains.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PDF text tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils

      - name: Download official Meitetsu Seto timetables
        shell: bash
        run: |
          set -euo pipefail

          WEEKDAY_URL='https://www.meitetsu.co.jp/train/timetable/__icsFiles/afieldfile/2026/02/25/20260314_ST_W1.pdf'
          HOLIDAY_URL='https://www.meitetsu.co.jp/train/timetable/__icsFiles/afieldfile/2026/02/25/20260314_ST_H1.pdf'

          curl -fsSL "$WEEKDAY_URL" -o /tmp/seto-weekday.pdf
          curl -fsSL "$HOLIDAY_URL" -o /tmp/seto-holiday.pdf

          test -s /tmp/seto-weekday.pdf
          test -s /tmp/seto-holiday.pdf

      - name: Convert official PDFs to layout text
        shell: bash
        run: |
          set -euo pipefail

          pdftotext -layout /tmp/seto-weekday.pdf /tmp/seto-weekday.txt
          pdftotext -layout /tmp/seto-holiday.pdf /tmp/seto-holiday.txt

          grep -q '2026年03月14日改正' /tmp/seto-weekday.txt
          grep -q '2026年03月14日改正' /tmp/seto-holiday.txt
          grep -q '栄.*町' /tmp/seto-weekday.txt
          grep -q '大森.*金城学院前' /tmp/seto-weekday.txt

      - name: Inspect late-night timetable text
        shell: bash
        run: |
          echo '===== WEEKDAY LAST 120 LINES ====='
          tail -n 120 /tmp/seto-weekday.txt

          echo '===== HOLIDAY LAST 120 LINES ====='
          tail -n 120 /tmp/seto-holiday.txt

      - name: Validate known late-night anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          weekday = Path('/tmp/seto-weekday.txt').read_text(
              encoding='utf-8',
              errors='replace',
          )
          holiday = Path('/tmp/seto-holiday.txt').read_text(
              encoding='utf-8',
              errors='replace',
          )

          for text in (weekday, holiday):
              assert '栄' in text and '町' in text
              assert '喜多山' in text
              assert '大森・金城学院前' in text
              assert '尾張瀬戸' in text

          # Official 2026-03-14 timetable late-night anchor:
          # final Sakaemachi departure is 00:00 to Kitayama.
          assert '2481' in weekday
          assert '2481' in holiday

          print('Meitetsu Seto PDF extraction anchors: OK')
          PY

      - name: Generate ST01-ST12 last-train boundaries
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/generate-meitetsu-seto-last-trains.py \
            --weekday /tmp/seto-weekday.txt \
            --holiday /tmp/seto-holiday.txt \
            --output /tmp/meitetsu-seto-last-trains.json \
            --revision 2026-03-14

      - name: Validate generated Nagoya-city Seto boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          with open("/tmp/meitetsu-seto-last-trains.json", encoding="utf-8") as f:
              data = json.load(f)

          assert len(data["destinations"]) == 12
          assert data["destinations"]["ST01"]["routes"] == {}

          for day_type in ("weekday", "saturday_holiday"):
              for code in (
                  "ST02", "ST03", "ST04", "ST05", "ST06",
                  "ST07", "ST08", "ST09", "ST10", "ST11",
              ):
                  route = data["destinations"][code]["routes"]["sakaemachi"][day_type]
                  assert route["lastDeparture"] == "00:00", (code, route)
                  assert route["trainTerminal"] == "喜多山", (code, route)
                  assert route["transfers"] == 0, (code, route)
                  assert route["status"] == "verified", (code, route)

              st12 = data["destinations"]["ST12"]["routes"]["sakaemachi"][day_type]
              assert st12["lastDeparture"] == "23:45", st12
              assert st12["trainTerminal"] == "尾張瀬戸", st12
              assert st12["transfers"] == 0, st12
              assert st12["status"] == "verified", st12

          print("Generated Meitetsu Seto ST01-ST12 boundary validation: OK")
          PY

      - name: Upload extracted text artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meitetsu-seto-poc
          path: |
            /tmp/seto-weekday.txt
            /tmp/seto-holiday.txt
            /tmp/meitetsu-seto-last-trains.json
          if-no-files-found: error
          retention-days: 7
