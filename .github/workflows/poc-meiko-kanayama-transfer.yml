name: PoC Nagoya Meiko Kanayama Transfer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-meiko-kanayama-transfer.yml'
      - 'scripts/extract-nagoya-subway.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download official Meijo and Meiko timetable ZIPs
        shell: bash
        run: |
          set -euo pipefail

          MEIJO_URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/e6fb0551-8fba-49fd-b0ef-c2dc5e2444e4/download/20250929_subway-timetable-meijoline.zip'
          MEIKO_URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/5e684b8c-81d4-4df3-b325-795325e0773c/download/20250929_subway-timetable-meikoline.zip'

          curl -fsSL "$MEIJO_URL" -o /tmp/meijo.zip
          curl -fsSL "$MEIKO_URL" -o /tmp/meiko.zip

      - name: Inspect Kanayama M01 and E01 workbooks
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          import io
          import json
          import zipfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "extractor",
              Path("scripts/extract-nagoya-subway.py"),
          )
          extractor = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(extractor)

          for zip_path, code, name in (
              ("/tmp/meijo.zip", "M01", "金山"),
              ("/tmp/meiko.zip", "E01", "金山"),
          ):
              with zipfile.ZipFile(zip_path) as outer:
                  info, recovered = extractor.find_workbook(outer, code, name)
                  print(json.dumps({
                      "zip": zip_path,
                      "stationCode": code,
                      "workbook": extractor.normalize_text(recovered),
                  }, ensure_ascii=False))

                  with zipfile.ZipFile(io.BytesIO(outer.read(info))) as book:
                      names = extractor.sheet_names(book)
                      print(json.dumps({
                          "stationCode": code,
                          "sheetNames": names,
                      }, ensure_ascii=False))

                      for sheet_index, sheet_name in enumerate(names, start=1):
                          cells = extractor.read_sheet_cells(
                              book,
                              f"xl/worksheets/sheet{sheet_index}.xml",
                          )
                          blocks = extractor.detect_timetable_blocks(cells)
                          markers = extractor.marker_destinations(cells)

                          block_ranges = [
                              (blocks[0], blocks[1]),
                              (blocks[1], 120),
                          ]

                          schedules = {}
                          for day_type, (hour_col, end_col) in zip(
                              ("weekday", "saturday_holiday"),
                              block_ranges,
                          ):
                              schedules[day_type] = extractor.parse_block(
                                  cells,
                                  hour_col,
                                  end_col,
                                  "__UNMARKED__",
                                  markers,
                              )

                          late = {
                              day_type: [
                                  item
                                  for item in departures
                                  if item["serviceMinutes"] >= 23 * 60
                              ][-12:]
                              for day_type, departures in schedules.items()
                          }

                          print(json.dumps({
                              "stationCode": code,
                              "sheet": sheet_name,
                              "markers": markers,
                              "late": late,
                          }, ensure_ascii=False, indent=2))
          PY

      - name: Validate official published end-of-service anchors
        shell: bash
        run: |
          python3 - <<'PY'
          # These anchors are independently published by Nagoya City
          # Transportation Bureau's first/last train page (2025-09-29).
          # This PoC will next prove the same connection from station XLSX data.
          anchors = {
              "sakae_to_kanayama_candidate": {
                  "sakaeDeparture": "00:02",
                  "kanayamaTime": "00:10",
                  "terminal": "瑞穂運動場東",
              },
              "meiko_last_from_kanayama": {
                  "kanayamaDeparture": "00:18",
                  "nagoyakoArrival": "00:30",
              },
          }

          assert anchors["sakae_to_kanayama_candidate"]["kanayamaTime"] < \
              anchors["meiko_last_from_kanayama"]["kanayamaDeparture"]

          print("Published end-of-service anchors: OK")
          PY
