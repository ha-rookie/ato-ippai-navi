name: Verify Meitetsu Inuyama Production

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/last-trains-nagoya.json'
      - 'scripts/poc-meitetsu-inuyama-nagoya.py'
      - '.github/workflows/verify-meitetsu-inuyama-production.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve representative service dates
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo('Asia/Tokyo')).date()
          weekday = today
          while weekday.weekday() >= 5:
              weekday += timedelta(days=1)
          saturday = today + timedelta(days=(5 - today.weekday()) % 7)
          print(f'MEITETSU_WEEKDAY_DATE={weekday.isoformat()}')
          print(f'MEITETSU_HOLIDAY_DATE={saturday.isoformat()}')
          PY

      - name: Download official Meitetsu direct timetable sources
        shell: bash
        run: |
          set -euo pipefail

          BASE='https://trainbus.meitetsu.co.jp/meitetsu-transfer/pc'
          COOKIE_JAR=/tmp/meitetsu-inuyama-prod-cookies.txt
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'

          fetch() {
            local url="$1"
            local output="$2"
            curl --fail --silent --show-error --location --compressed \
              --retry 2 --retry-delay 1 \
              --user-agent "$UA" \
              --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
              --referer 'https://www.meitetsu.co.jp/' \
              --cookie "$COOKIE_JAR" --cookie-jar "$COOKIE_JAR" \
              "$url" -o "$output"
            test -s "$output"
          }

          fetch "$BASE/map/Top?window=transfer" /tmp/meitetsu-inuyama-top.html

          declare -A NODES=(
            [IY02]=00006073
            [IY03]=00003971
          )

          for code in IY02 IY03; do
            fetch \
              "$BASE/transfer/DepArrTimeList?date=$MEITETSU_WEEKDAY_DATE&gnode=${NODES[$code]}&snode=00004372" \
              "/tmp/meitetsu-inuyama-${code}-weekday.html"
            fetch \
              "$BASE/transfer/DepArrTimeList?date=$MEITETSU_HOLIDAY_DATE&gnode=${NODES[$code]}&snode=00004372" \
              "/tmp/meitetsu-inuyama-${code}-saturday_holiday.html"
          done

      - name: Generate official IY02-IY03 boundaries
        run: python3 scripts/poc-meitetsu-inuyama-nagoya.py

      - name: Compare official boundaries with production JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          with open('/tmp/meitetsu-inuyama-last-trains.json', encoding='utf-8') as f:
              official = json.load(f)
          with open('src/data/last-trains-nagoya.json', encoding='utf-8') as f:
              production = json.load(f)

          expected_nodes = {'IY02': '00006073', 'IY03': '00003971'}
          sources = {source['id'] for source in production['sources']}
          assert 'meitetsu-inuyama-official-direct-timetable' in sources

          for code, node_id in expected_nodes.items():
              generated = official['destinations'][code]
              stored = production['destinations'][code]

              # Node IDs are acquisition metadata, not runtime destination data.
              # Fail closed by checking the official-source generator mapping itself.
              assert generated['officialNodeId'] == node_id, code
              assert generated['officialStationCode'] == code, code

              assert stored['operator'] == 'meitetsu', code
              assert stored['line'] == 'inuyama', code
              assert stored['officialStationCode'] == code, code
              assert stored['name'] == generated['name'], code
              assert stored['routes'].keys() == {'nagoya'}, code

              for day_type in ('weekday', 'saturday_holiday'):
                  actual = generated['routes'][day_type]
                  expected = stored['routes']['nagoya'][day_type]

                  assert expected['lastDeparture'] == actual['lastDeparture'], (code, day_type)
                  assert expected['lastArrival'] == actual['lastArrival'], (code, day_type)
                  assert expected['trainTerminal'] == actual['trainTerminal'], (code, day_type)
                  assert expected['trainClass'] in actual['trainClasses'], (code, day_type, actual)
                  assert any(name.startswith('犬山線(') for name in actual['routeNames']), (code, day_type, actual)
                  assert expected['transfers'] == 0, (code, day_type)
                  assert expected['status'] == 'verified', (code, day_type)
                  assert expected['sourceIds'] == ['meitetsu-inuyama-official-direct-timetable'], (code, day_type)

          assert production['destinations']['IY02']['routes']['nagoya']['weekday']['lastDeparture'] == '23:41'
          assert production['destinations']['IY03']['routes']['nagoya']['weekday']['lastDeparture'] == '23:59'
          assert production['destinations']['IY03']['routes']['nagoya']['weekday']['lastArrival'] == '00:06'

          print('Meitetsu Inuyama production vs official source: OK')
          PY

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meitetsu-inuyama-production-verification
          if-no-files-found: warn
          path: |
            /tmp/meitetsu-inuyama-*.html
            /tmp/meitetsu-inuyama-last-trains.json
            /tmp/meitetsu-inuyama-route-diagnostics.json
            /tmp/meitetsu-inuyama-*-diagnostics.json
