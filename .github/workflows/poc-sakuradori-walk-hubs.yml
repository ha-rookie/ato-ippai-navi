name: PoC Nagoya Sakuradori Walk Hubs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-sakuradori-walk-hubs.yml'
      - 'scripts/extract-nagoya-subway.py'
      - 'scripts/generate-sakuradori-last-trains.py'
      - 'src/data/last-trains-nagoya.json'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download official Sakuradori timetable ZIP
        shell: bash
        run: |
          set -euo pipefail
          URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/874b00d8-ec39-4401-8cd2-0d1c535aa4c1/download/20230916_subway-timetable-sakuradoriline.zip'
          curl -fsSL "$URL" -o /tmp/sakuradori.zip

      - name: Inspect S04 Marunouchi and S05 Hisaya-odori
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          import io
          import json
          import zipfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "extractor",
              Path("scripts/extract-nagoya-subway.py"),
          )
          extractor = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(extractor)

          with zipfile.ZipFile("/tmp/sakuradori.zip") as outer:
              files = [
                  extractor.normalize_text(
                      extractor.recover_zip_name(info.filename)
                  )
                  for info in outer.infolist()
                  if not info.is_dir()
                  and info.filename.lower().endswith(".xlsx")
              ]

              print(json.dumps({
                  "workbookCount": len(files),
                  "first": files[:3],
                  "last": files[-3:],
              }, ensure_ascii=False, indent=2))

              assert len(files) == 21, len(files)

              for code, name in (("S04", "丸の内"), ("S05", "久屋大通")):
                  info, recovered = extractor.find_workbook(
                      outer,
                      code,
                      name,
                  )

                  with zipfile.ZipFile(io.BytesIO(outer.read(info))) as book:
                      names = extractor.sheet_names(book)
                      print(json.dumps({
                          "stationCode": code,
                          "stationName": name,
                          "workbook": extractor.normalize_text(recovered),
                          "sheetNames": names,
                      }, ensure_ascii=False))

                      for sheet_index, sheet_name in enumerate(names, start=1):
                          cells = extractor.read_sheet_cells(
                              book,
                              f"xl/worksheets/sheet{sheet_index}.xml",
                          )
                          blocks = extractor.detect_timetable_blocks(cells)
                          markers = extractor.marker_destinations(cells)

                          print(json.dumps({
                              "stationCode": code,
                              "sheet": sheet_name,
                              "timetableBlocks": blocks,
                              "markers": markers,
                          }, ensure_ascii=False))

                          ranges = [
                              (blocks[0], blocks[1]),
                              (blocks[1], 120),
                          ]

                          for day_type, (hour_col, end_col) in zip(
                              ("weekday", "saturday_holiday"),
                              ranges,
                          ):
                              departures = extractor.parse_block(
                                  cells,
                                  hour_col,
                                  end_col,
                                  "__UNMARKED__",
                                  markers,
                              )
                              late = [
                                  item
                                  for item in departures
                                  if item["serviceMinutes"] >= 23 * 60
                              ]
                              print(json.dumps({
                                  "stationCode": code,
                                  "sheet": sheet_name,
                                  "dayType": day_type,
                                  "late": late[-16:],
                              }, ensure_ascii=False, indent=2))
          PY

      - name: Extract normalized S04 and S05 timetables
        shell: bash
        run: |
          set -euo pipefail

          URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/874b00d8-ec39-4401-8cd2-0d1c535aa4c1/download/20230916_subway-timetable-sakuradoriline.zip'

          for spec in \
            'marunouchi:S04:丸の内' \
            'hisayaodori:S05:久屋大通'
          do
            IFS=':' read -r id code name <<< "$spec"

            python3 scripts/extract-nagoya-subway.py \
              --zip /tmp/sakuradori.zip \
              --output "/tmp/${id}-up.json" \
              --station-code "$code" \
              --station-name "$name" \
              --direction-sheet 上り \
              --default-terminal 太閤通 \
              --revision 2023-09-16 \
              --source-url "$URL"

            python3 scripts/extract-nagoya-subway.py \
              --zip /tmp/sakuradori.zip \
              --output "/tmp/${id}-down.json" \
              --station-code "$code" \
              --station-name "$name" \
              --direction-sheet 下り \
              --default-terminal 徳重 \
              --revision 2023-09-16 \
              --source-url "$URL"
          done

      - name: Generate Sakuradori direct last-train boundaries
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/generate-sakuradori-last-trains.py \
            --origin marunouchi:S04:/tmp/marunouchi-up.json:/tmp/marunouchi-down.json \
            --origin hisayaodori:S05:/tmp/hisayaodori-up.json:/tmp/hisayaodori-down.json \
            --output /tmp/sakuradori-last-trains.json \
            --revision 2023-09-16

      - name: Validate generated Sakuradori boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          with open("/tmp/sakuradori-last-trains.json", encoding="utf-8") as f:
              data = json.load(f)

          assert len(data["destinations"]) == 21
          assert set(data["origins"]) == {"marunouchi", "hisayaodori"}

          expected = {
              ("S01", "marunouchi"): ("00:25", "太閤通"),
              ("S01", "hisayaodori"): ("00:23", "太閤通"),
              ("S08", "marunouchi"): ("00:22", "今池"),
              ("S08", "hisayaodori"): ("00:24", "今池"),
              ("S09", "marunouchi"): ("00:06", "野並"),
              ("S09", "hisayaodori"): ("00:08", "野並"),
              ("S17", "marunouchi"): ("00:06", "野並"),
              ("S17", "hisayaodori"): ("00:08", "野並"),
              ("S18", "marunouchi"): ("23:55", "徳重"),
              ("S18", "hisayaodori"): ("23:56", "徳重"),
              ("S21", "marunouchi"): ("23:55", "徳重"),
              ("S21", "hisayaodori"): ("23:56", "徳重"),
          }

          for day_type in ("weekday", "saturday_holiday"):
              for (code, origin), (departure, terminal) in expected.items():
                  route = data["destinations"][code]["routes"][origin][day_type]
                  assert route["lastDeparture"] == departure, (code, origin, route)
                  assert route["trainTerminal"] == terminal, (code, origin, route)
                  assert route["transfers"] == 0, (code, origin, route)
                  assert route["status"] == "verified", (code, origin, route)

          assert data["destinations"]["S04"]["routes"].get("marunouchi") is None
          assert data["destinations"]["S05"]["routes"].get("hisayaodori") is None

          print("Generated Sakuradori boundary validation: OK")
          PY

      - name: Compare generated Sakuradori boundaries with production JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          with open("/tmp/sakuradori-last-trains.json", encoding="utf-8") as f:
              generated = json.load(f)
          with open("src/data/last-trains-nagoya.json", encoding="utf-8") as f:
              production = json.load(f)

          assert len([
              code
              for code in production["destinations"]
              if code.startswith("S")
          ]) == 21

          assert production["origins"]["marunouchi"]["enabled"] is True
          assert production["origins"]["hisayaodori"]["enabled"] is True
          assert production["origins"]["marunouchi"]["stationCodes"] == ["T06", "S04"]
          assert production["origins"]["hisayaodori"]["stationCodes"] == ["M06", "S05"]

          for code, destination in generated["destinations"].items():
              prod = production["destinations"].get(code)
              assert prod is not None, code
              assert prod["enabled"] is True, code
              assert prod["name"] == destination["name"], code
              assert prod["stationCodes"] == destination["stationCodes"], code
              assert prod["routes"] == destination["routes"], code

          source_ids = {source["id"] for source in production["sources"]}
          assert "nagoya-subway-pocket-timetable-sakuradori" in source_ids

          print("Production Sakuradori boundary comparison: OK")
          PY

      - name: Validate current official end-of-service anchors
        shell: bash
        run: |
          python3 - <<'PY'
          anchors = {
              "east": {
                  "marunouchi": {
                      "tokushige": "23:55",
                      "nonami": "00:06",
                      "imaike": "00:22",
                  },
                  "hisayaodori": {
                      "tokushige": "23:56",
                      "nonami": "00:08",
                      "imaike": "00:24",
                  },
              },
              "west": {
                  "hisayaodori": {
                      "taikodori": "00:23",
                  },
                  "marunouchi": {
                      "taikodori": "00:25",
                  },
              },
          }

          assert anchors["east"]["marunouchi"]["imaike"] == "00:22"
          assert anchors["east"]["hisayaodori"]["imaike"] == "00:24"
          assert anchors["west"]["hisayaodori"]["taikodori"] == "00:23"
          assert anchors["west"]["marunouchi"]["taikodori"] == "00:25"

          print("Current official Sakuradori end-of-service anchors: OK")
          PY
