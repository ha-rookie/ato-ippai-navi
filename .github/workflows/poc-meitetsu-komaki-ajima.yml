name: Verify Meitetsu Komaki Ajima Production

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/last-trains-nagoya.json'
      - 'scripts/poc-meitetsu-komaki-ajima.py'
      - '.github/workflows/poc-meitetsu-komaki-ajima.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve representative service dates
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo('Asia/Tokyo')).date()
          weekday = today
          while weekday.weekday() >= 5:
              weekday += timedelta(days=1)
          saturday = today + timedelta(days=(5 - today.weekday()) % 7)
          print(f'MEITETSU_WEEKDAY_DATE={weekday.isoformat()}')
          print(f'MEITETSU_HOLIDAY_DATE={saturday.isoformat()}')
          PY

      - name: Download Nagoya City official Meijo timetable
        shell: bash
        run: |
          set -euo pipefail
          URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/e6fb0551-8fba-49fd-b0ef-c2dc5e2444e4/download/20250929_subway-timetable-meijoline.zip'
          curl --fail --silent --show-error --location --retry 2 --retry-delay 1 "$URL" -o /tmp/meijo.zip
          test -s /tmp/meijo.zip

      - name: Extract Sakae and Heiandori right-direction timetables
        shell: bash
        run: |
          set -euo pipefail
          URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/e6fb0551-8fba-49fd-b0ef-c2dc5e2444e4/download/20250929_subway-timetable-meijoline.zip'

          python3 scripts/extract-nagoya-subway.py \
            --zip /tmp/meijo.zip \
            --output /tmp/sakae-right.json \
            --station-code M05 \
            --station-name 栄 \
            --direction-sheet 上り \
            --default-terminal 名城線右回り \
            --revision 2025-09-29 \
            --source-url "$URL"

          python3 scripts/extract-nagoya-subway.py \
            --zip /tmp/meijo.zip \
            --output /tmp/heiandori-right.json \
            --station-code M11 \
            --station-name 平安通 \
            --direction-sheet 上り \
            --default-terminal 名城線右回り \
            --revision 2025-09-29 \
            --source-url "$URL"

      - name: Download official Meitetsu Heian-dori to Ajima direct timetables
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://trainbus.meitetsu.co.jp/meitetsu-transfer/pc'
          COOKIE_JAR=/tmp/meitetsu-komaki-prod-cookies.txt
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'

          fetch() {
            local url="$1"
            local output="$2"
            curl --fail --silent --show-error --location --compressed \
              --retry 2 --retry-delay 1 \
              --user-agent "$UA" \
              --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
              --referer 'https://www.meitetsu.co.jp/' \
              --cookie "$COOKIE_JAR" --cookie-jar "$COOKIE_JAR" \
              "$url" -o "$output"
            test -s "$output"
          }

          fetch "$BASE/map/Top?window=transfer" /tmp/meitetsu-komaki-top.html
          fetch \
            "$BASE/transfer/DepArrTimeList?date=$MEITETSU_WEEKDAY_DATE&gnode=00008545&snode=00008059" \
            /tmp/meitetsu-ajima-direct-weekday.html
          fetch \
            "$BASE/transfer/DepArrTimeList?date=$MEITETSU_HOLIDAY_DATE&gnode=00008545&snode=00008059" \
            /tmp/meitetsu-ajima-direct-saturday_holiday.html

      - name: Generate official KM12 boundary
        run: python3 scripts/poc-meitetsu-komaki-ajima.py

      - name: Compare official boundary with production JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          with open('/tmp/meitetsu-komaki-ajima-poc.json', encoding='utf-8') as f:
              official = json.load(f)
          with open('src/data/last-trains-nagoya.json', encoding='utf-8') as f:
              production = json.load(f)

          assert official['destination'] == {
              'code': 'KM12', 'name': '味鋺', 'nodeId': '00008545'
          }
          assert official['directOrigin'] == {
              'code': 'M11', 'name': '平安通', 'nodeId': '00008059'
          }
          assert official['minimumTransferLeadMinutes'] == 3
          assert official['meijoSakaeToHeiandoriMinutes'] == 12

          source_ids = {item['id'] for item in production['sources']}
          assert 'nagoya-subway-pocket-timetable-meijo' in source_ids
          assert 'meitetsu-komaki-official-direct-timetable' in source_ids

          stored = production['destinations']['KM12']
          assert stored['operator'] == 'meitetsu'
          assert stored['line'] == 'komaki'
          assert stored['officialStationCode'] == 'KM12'
          assert stored['name'] == '味鋺'
          assert stored['stationCodes'] == ['KM12']
          assert set(stored['routes']) == {'sakae'}

          for day_type in ('weekday', 'saturday_holiday'):
              day = official['days'][day_type]
              generated = day['boundary']
              route = stored['routes']['sakae'][day_type]

              assert day['directIdentity']['originPresent'] is True
              assert day['directIdentity']['destinationPresent'] is True
              assert day['directIdentity']['directTimetableMarkerPresent'] is True

              assert generated['lastDeparture'] == '23:42'
              assert generated['transferReadyTime'] == '23:54'
              assert generated['connectionDeparture'] == '00:06'
              assert generated['lastArrival'] == '00:10'
              assert generated['transferMarginMinutes'] == 12
              assert generated['minimumTransferLeadMinutes'] == 3
              assert generated['feeder']['travelMinutes'] == 12
              assert generated['direct']['terminals'] == ['小牧']

              assert route['lastDeparture'] == generated['lastDeparture']
              assert route['lastArrival'] == generated['lastArrival']
              assert route['routeSummary'] == '名城線 → 平安通乗換 → 上飯田線・名鉄小牧線直通'
              assert route['trainTerminal'] == '小牧'
              assert route['transferAt'] == '平安通'
              assert route['transferStationCodes'] == ['M11', 'K02']
              assert route['transferReadyTime'] == generated['transferReadyTime']
              assert route['connectionDeparture'] == generated['connectionDeparture']
              assert route['connectionTerminal'] == '小牧'
              assert route['minimumTransferLeadMinutes'] == 3
              assert route['transferMarginMinutes'] == 12
              assert route['transfers'] == 1
              assert route['status'] == 'verified'
              assert route['sourceIds'] == [
                  'nagoya-subway-pocket-timetable-meijo',
                  'meitetsu-komaki-official-direct-timetable'
              ]

          print('Meitetsu Komaki KM12 production vs official source: OK')
          PY

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meitetsu-komaki-ajima-production-verification
          if-no-files-found: warn
          path: |
            /tmp/meitetsu-komaki-*.html
            /tmp/meitetsu-ajima-*.html
            /tmp/sakae-right.json
            /tmp/heiandori-right.json
            /tmp/meitetsu-komaki-ajima-poc.json
