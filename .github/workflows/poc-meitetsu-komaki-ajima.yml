name: PoC Meitetsu Komaki Ajima

on:
  workflow_dispatch:
  push:
    branches:
      - poc/meitetsu-komaki-ajima
    paths:
      - '.github/workflows/poc-meitetsu-komaki-ajima.yml'
      - 'scripts/poc-meitetsu-komaki-ajima.py'
      - 'scripts/extract-nagoya-subway.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve representative service dates
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo('Asia/Tokyo')).date()
          weekday = today
          while weekday.weekday() >= 5:
              weekday += timedelta(days=1)
          saturday = today + timedelta(days=(5 - today.weekday()) % 7)
          print(f'MEITETSU_WEEKDAY_DATE={weekday.isoformat()}')
          print(f'MEITETSU_HOLIDAY_DATE={saturday.isoformat()}')
          PY

      - name: Download Nagoya City official Meijo timetable
        shell: bash
        run: |
          set -euo pipefail
          URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/e6fb0551-8fba-49fd-b0ef-c2dc5e2444e4/download/20250929_subway-timetable-meijoline.zip'
          curl --fail --silent --show-error --location --retry 2 --retry-delay 1 "$URL" -o /tmp/meijo.zip
          test -s /tmp/meijo.zip

      - name: Extract Sakae and Heiandori right-direction timetables
        shell: bash
        run: |
          set -euo pipefail
          URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/e6fb0551-8fba-49fd-b0ef-c2dc5e2444e4/download/20250929_subway-timetable-meijoline.zip'

          python3 scripts/extract-nagoya-subway.py \
            --zip /tmp/meijo.zip \
            --output /tmp/sakae-right.json \
            --station-code M05 \
            --station-name 栄 \
            --direction-sheet 上り \
            --default-terminal 名城線右回り \
            --revision 2025-09-29 \
            --source-url "$URL"

          python3 scripts/extract-nagoya-subway.py \
            --zip /tmp/meijo.zip \
            --output /tmp/heiandori-right.json \
            --station-code M11 \
            --station-name 平安通 \
            --direction-sheet 上り \
            --default-terminal 名城線右回り \
            --revision 2025-09-29 \
            --source-url "$URL"

      - name: Download official Meitetsu Heian-dori to Ajima direct timetables
        shell: bash
        run: |
          set -euo pipefail

          BASE='https://trainbus.meitetsu.co.jp/meitetsu-transfer/pc'
          COOKIE_JAR=/tmp/meitetsu-komaki-cookies.txt
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'

          fetch() {
            local url="$1"
            local output="$2"
            echo "GET $url"
            curl --fail --silent --show-error --location --compressed \
              --retry 2 --retry-delay 1 \
              --user-agent "$UA" \
              --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
              --referer 'https://www.meitetsu.co.jp/' \
              --cookie "$COOKIE_JAR" --cookie-jar "$COOKIE_JAR" \
              "$url" -o "$output"
            test -s "$output"
          }

          fetch "$BASE/map/Top?window=transfer" /tmp/meitetsu-komaki-top.html

          fetch \
            "$BASE/diagram/TrainDiagram?direction=down&linkId=00001002&startId=00008059" \
            /tmp/meitetsu-heiandori-kamiida-timetable.html
          fetch \
            "$BASE/diagram/TrainDiagram?direction=down&linkId=00000869&startId=00008545" \
            /tmp/meitetsu-ajima-station-timetable.html

          fetch \
            "$BASE/transfer/DepArrTimeList?date=$MEITETSU_WEEKDAY_DATE&gnode=00008545&snode=00008059" \
            /tmp/meitetsu-ajima-direct-weekday.html
          fetch \
            "$BASE/transfer/DepArrTimeList?date=$MEITETSU_HOLIDAY_DATE&gnode=00008545&snode=00008059" \
            /tmp/meitetsu-ajima-direct-saturday_holiday.html

      - name: Verify static timetable identities and late anchors
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import re
          from pathlib import Path

          def text(path):
              raw = Path(path).read_bytes()
              for enc in ('utf-8', 'cp932', 'shift_jis'):
                  try:
                      source = raw.decode(enc)
                      break
                  except UnicodeDecodeError:
                      continue
              else:
                  raise AssertionError(path)
              source = re.sub(r'<[^>]+>', ' ', source)
              return re.sub(r'\s+', ' ', html.unescape(source))

          heian = text('/tmp/meitetsu-heiandori-kamiida-timetable.html')
          ajima = text('/tmp/meitetsu-ajima-station-timetable.html')

          assert '平安通' in heian
          assert '上飯田線' in heian
          assert '小牧' in heian
          assert '味鋺' in ajima
          assert 'KM12' in ajima
          print('Meitetsu static timetable identity: OK')
          PY

      - name: Calculate KM12 boundary from official sources
        run: python3 scripts/poc-meitetsu-komaki-ajima.py

      - name: Show PoC result
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/meitetsu-komaki-ajima-poc.json ]; then
            cat /tmp/meitetsu-komaki-ajima-poc.json
          fi

      - name: Upload PoC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meitetsu-komaki-ajima-poc
          if-no-files-found: warn
          path: |
            /tmp/meitetsu-komaki-*.html
            /tmp/meitetsu-heiandori-kamiida-timetable.html
            /tmp/meitetsu-ajima-*.html
            /tmp/sakae-right.json
            /tmp/heiandori-right.json
            /tmp/meitetsu-komaki-ajima-poc.json
