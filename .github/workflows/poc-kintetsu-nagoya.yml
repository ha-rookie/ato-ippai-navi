name: PoC Kintetsu Nagoya

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-kintetsu-nagoya.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download official Kintetsu Nagoya timetables
        shell: bash
        run: |
          set -euo pipefail

          WEEKDAY_URL='https://eki.kintetsu.co.jp/norikae/T5?USR=PC&d=1&dw=0&slCode=413-1'
          HOLIDAY_URL='https://eki.kintetsu.co.jp/norikae/T5?USR=PC&d=1&dw=1&slCode=413-1'

          curl -fsSL "$WEEKDAY_URL" -o /tmp/kintetsu-weekday.html
          curl -fsSL "$HOLIDAY_URL" -o /tmp/kintetsu-holiday.html

          test -s /tmp/kintetsu-weekday.html
          test -s /tmp/kintetsu-holiday.html

      - name: Inspect encoding and late-night anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import html
          import re
          from pathlib import Path


          def decode(path: str) -> str:
              raw = Path(path).read_bytes()

              for encoding in ("utf-8", "cp932", "shift_jis"):
                  try:
                      text = raw.decode(encoding)
                      print(path, "encoding=", encoding)
                      return text
                  except UnicodeDecodeError:
                      pass

              raise RuntimeError(f"Unable to decode {path}")


          def plain(text: str) -> str:
              text = re.sub(r"<script.*?</script>", " ", text, flags=re.I | re.S)
              text = re.sub(r"<style.*?</style>", " ", text, flags=re.I | re.S)
              text = re.sub(r"<[^>]+>", " ", text)
              return re.sub(r"\s+", " ", html.unescape(text))


          for path, day_type in (
              ("/tmp/kintetsu-weekday.html", "weekday"),
              ("/tmp/kintetsu-holiday.html", "saturday_holiday"),
          ):
              source = decode(path)
              text = plain(source)

              assert "近鉄名古屋" in text, text[:500]
              assert (
                  "2026/3/14現在" in text
                  or "2026年3月14日現在" in text
              ), text[:1000]
              assert "富吉" in text
              assert re.search(
                  r"(?:^|\s)0:04\s+富吉\s+普通(?:\s|$)",
                  text,
              ), text[-1500:]

              print("====", day_type, "plain tail ====")
              print(text[-3000:])

              anchors = []

              for match in re.finditer(
                  r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',
                  source,
                  flags=re.I | re.S,
              ):
                  href = html.unescape(match.group(1))
                  label = plain(match.group(2))

                  if (
                      "T7" in href
                      or "富吉" in label
                      or re.search(r"(?:^|\s)04(?:\s|$)", label)
                  ):
                      anchors.append((href, label))

              print("====", day_type, "candidate anchors ====")

              for href, label in anchors[-60:]:
                  print(repr(label), href)

              assert anchors, "No timetable detail anchors found"

          print("Kintetsu official timetable HTML inspection: OK")
          PY

      - name: Upload official HTML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kintetsu-nagoya-poc
          path: |
            /tmp/kintetsu-weekday.html
            /tmp/kintetsu-holiday.html
          if-no-files-found: error
          retention-days: 7
