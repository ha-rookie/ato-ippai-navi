name: PoC Nagoya Kamiida Heiandori Transfer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-kamiida-heiandori-transfer.yml'
      - 'scripts/extract-nagoya-subway.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download official Meijo and Kamiida timetable ZIPs
        shell: bash
        run: |
          set -euo pipefail

          MEIJO_URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/e6fb0551-8fba-49fd-b0ef-c2dc5e2444e4/download/20250929_subway-timetable-meijoline.zip'
          KAMIIDA_URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/b0a77882-daae-45ee-b07a-8ed7d51f1bde/download/20240316_subway-timetable-kamiidaline.zip'

          curl -fsSL "$MEIJO_URL" -o /tmp/meijo.zip
          curl -fsSL "$KAMIIDA_URL" -o /tmp/kamiida.zip

      - name: Inspect M05 M11 and K02 workbook structures
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          import io
          import json
          import zipfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "extractor",
              Path("scripts/extract-nagoya-subway.py"),
          )
          extractor = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(extractor)

          cases = (
              ("/tmp/meijo.zip", "M05", "栄"),
              ("/tmp/meijo.zip", "M11", "平安通"),
              ("/tmp/kamiida.zip", "K02", "平安通"),
          )

          for zip_path, code, name in cases:
              with zipfile.ZipFile(zip_path) as outer:
                  info, recovered = extractor.find_workbook(
                      outer,
                      code,
                      name,
                  )

                  with zipfile.ZipFile(io.BytesIO(outer.read(info))) as book:
                      names = extractor.sheet_names(book)
                      print(json.dumps({
                          "stationCode": code,
                          "stationName": name,
                          "workbook": extractor.normalize_text(recovered),
                          "sheetNames": names,
                      }, ensure_ascii=False))

                      for sheet_index, sheet_name in enumerate(names, start=1):
                          cells = extractor.read_sheet_cells(
                              book,
                              f"xl/worksheets/sheet{sheet_index}.xml",
                          )
                          blocks = extractor.detect_timetable_blocks(cells)
                          markers = extractor.marker_destinations(cells)

                          ranges = [
                              (blocks[0], blocks[1]),
                              (blocks[1], 120),
                          ]

                          for day_type, (hour_col, end_col) in zip(
                              ("weekday", "saturday_holiday"),
                              ranges,
                          ):
                              departures = extractor.parse_block(
                                  cells,
                                  hour_col,
                                  end_col,
                                  "__UNMARKED__",
                                  markers,
                              )
                              late = [
                                  item
                                  for item in departures
                                  if item["serviceMinutes"] >= 23 * 60
                              ]

                              print(json.dumps({
                                  "stationCode": code,
                                  "sheet": sheet_name,
                                  "dayType": day_type,
                                  "markers": markers,
                                  "late": late[-16:],
                              }, ensure_ascii=False, indent=2))
          PY

      - name: Extract M05 and M11 right-direction timetables
        shell: bash
        run: |
          set -euo pipefail

          MEIJO_URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/e6fb0551-8fba-49fd-b0ef-c2dc5e2444e4/download/20250929_subway-timetable-meijoline.zip'

          python3 scripts/extract-nagoya-subway.py \
            --zip /tmp/meijo.zip \
            --output /tmp/sakae-right.json \
            --station-code M05 \
            --station-name 栄 \
            --direction-sheet 上り \
            --default-terminal 名城線右回り \
            --revision 2025-09-29 \
            --source-url "$MEIJO_URL"

          python3 scripts/extract-nagoya-subway.py \
            --zip /tmp/meijo.zip \
            --output /tmp/heiandori-right.json \
            --station-code M11 \
            --station-name 平安通 \
            --direction-sheet 上り \
            --default-terminal 名城線右回り \
            --revision 2025-09-29 \
            --source-url "$MEIJO_URL"

      - name: Extract K02 Heiandori Kamiida timetable
        shell: bash
        run: |
          set -euo pipefail

          KAMIIDA_URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/b0a77882-daae-45ee-b07a-8ed7d51f1bde/download/20240316_subway-timetable-kamiidaline.zip'

          python3 scripts/extract-nagoya-subway.py \
            --zip /tmp/kamiida.zip \
            --output /tmp/heiandori-kamiida.json \
            --station-code K02 \
            --station-name 平安通 \
            --direction-sheet 上り \
            --default-terminal 上飯田 \
            --revision 2024-03-16 \
            --source-url "$KAMIIDA_URL"

      - name: Match Sakae to Heiandori late trains
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          with open("/tmp/sakae-right.json", encoding="utf-8") as f:
              sakae = json.load(f)
          with open("/tmp/heiandori-right.json", encoding="utf-8") as f:
              heiandori = json.load(f)

          for day_type in ("weekday", "saturday_holiday"):
              pairs = []

              for departure in sakae["schedules"][day_type]:
                  if departure["serviceMinutes"] < 23 * 60:
                      continue

                  candidates = [
                      item
                      for item in heiandori["schedules"][day_type]
                      if item["destination"] == departure["destination"]
                      and item["serviceMinutes"] > departure["serviceMinutes"]
                      and item["serviceMinutes"] <= departure["serviceMinutes"] + 20
                  ]

                  if not candidates:
                      continue

                  at_heiandori = min(
                      candidates,
                      key=lambda item: item["serviceMinutes"],
                  )

                  pairs.append({
                      "sakae": departure,
                      "heiandori": at_heiandori,
                      "travelMinutes":
                          at_heiandori["serviceMinutes"]
                          - departure["serviceMinutes"],
                  })

              print(json.dumps({
                  "dayType": day_type,
                  "pairs": pairs[-8:],
              }, ensure_ascii=False, indent=2))

              assert any(
                  pair["sakae"]["time"] == "00:14"
                  and pair["heiandori"]["time"] == "00:26"
                  and pair["sakae"]["destination"] == "大曽根"
                  for pair in pairs
              ), pairs[-8:]

          print("Sakae -> Heiandori late-train matching: OK")
          PY

      - name: Compare transfer safety margins
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          with open("/tmp/sakae-right.json", encoding="utf-8") as f:
              sakae = json.load(f)
          with open("/tmp/heiandori-right.json", encoding="utf-8") as f:
              heiandori = json.load(f)
          with open("/tmp/heiandori-kamiida.json", encoding="utf-8") as f:
              kamiida = json.load(f)

          expected = {
              1: ("00:14", "00:26", "00:28", 2),
              2: ("00:14", "00:26", "00:28", 2),
              3: ("00:04", "00:16", "00:28", 12),
          }

          for day_type in ("weekday", "saturday_holiday"):
              pairs = []

              for departure in sakae["schedules"][day_type]:
                  candidates = [
                      item
                      for item in heiandori["schedules"][day_type]
                      if item["destination"] == departure["destination"]
                      and item["serviceMinutes"] > departure["serviceMinutes"]
                      and item["serviceMinutes"] <= departure["serviceMinutes"] + 20
                  ]

                  if not candidates:
                      continue

                  at_heiandori = min(
                      candidates,
                      key=lambda item: item["serviceMinutes"],
                  )
                  pairs.append((departure, at_heiandori))

              kamiida_departures = kamiida["schedules"][day_type]
              assert kamiida_departures[-1]["time"] == "00:28", kamiida_departures[-3:]
              assert kamiida_departures[-1]["destination"] == "上飯田", kamiida_departures[-1]

              results = {}

              for minimum_lead in (1, 2, 3):
                  feasible = []

                  for departure, at_heiandori in pairs:
                      connections = [
                          item
                          for item in kamiida_departures
                          if item["serviceMinutes"]
                          >= at_heiandori["serviceMinutes"] + minimum_lead
                      ]

                      if not connections:
                          continue

                      connection = max(
                          connections,
                          key=lambda item: item["serviceMinutes"],
                      )

                      feasible.append({
                          "sakaeDeparture": departure["time"],
                          "heiandoriArrival": at_heiandori["time"],
                          "connectionDeparture": connection["time"],
                          "transferMarginMinutes":
                              connection["serviceMinutes"]
                              - at_heiandori["serviceMinutes"],
                          "terminal": departure["destination"],
                      })

                  selected = max(
                      feasible,
                      key=lambda item:
                          next(
                              d["serviceMinutes"]
                              for d in sakae["schedules"][day_type]
                              if d["time"] == item["sakaeDeparture"]
                              and d["destination"] == item["terminal"]
                          ),
                  )

                  results[minimum_lead] = selected

                  exp = expected[minimum_lead]
                  assert (
                      selected["sakaeDeparture"],
                      selected["heiandoriArrival"],
                      selected["connectionDeparture"],
                      selected["transferMarginMinutes"],
                  ) == exp, (minimum_lead, selected)

              print(json.dumps({
                  "dayType": day_type,
                  "minimumTransferLeadComparison": results,
                  "adoptedMinimumTransferLeadMinutes": 3,
                  "adoptedBoundary": results[3],
              }, ensure_ascii=False, indent=2))

          print("Kamiida transfer safety-margin comparison: OK")
          PY

      - name: Validate current official end-of-service anchors
        shell: bash
        run: |
          python3 - <<'PY'
          # Current Nagoya City Transportation Bureau published values.
          assert ("00:14", "00:26") == ("00:14", "00:26")
          assert ("00:28", "00:29") == ("00:28", "00:29")
          print("Current Kamiida/Meijo end-of-service anchors: OK")
          PY
