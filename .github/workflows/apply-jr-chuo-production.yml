name: Apply JR Chuo Production

on:
  push:
    branches: [feat/jr-chuo-nagoya]
    paths:
      - 'scripts/apply-jr-chuo-production.py'
      - '.github/workflows/apply-jr-chuo-production.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/jr-chuo-nagoya

      - name: Apply migration
        run: python3 scripts/apply-jr-chuo-production.py

      - name: Commit generated production changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/data/last-trains-nagoya.json \
            public/index.html \
            public/js/settings.js \
            test/settings.test.js \
            test/last-train.test.js \
            docs/jr-chuo.md

          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi

          git commit -m 'feat: add JR Chuo Nagoya production support'
          git push origin HEAD:feat/jr-chuo-nagoya
