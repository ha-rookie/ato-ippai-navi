name: PoC Meitetsu Main Nagoya

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-meitetsu-main-nagoya.yml'
      - 'scripts/poc-meitetsu-main-nagoya.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download official Meitetsu sources
        shell: bash
        run: |
          set -euo pipefail

          BASE='https://trainbus.meitetsu.co.jp/meitetsu-transfer/pc'
          COOKIE_JAR=/tmp/meitetsu-cookies.txt
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'

          fetch() {
            local url="$1"
            local output="$2"
            echo "GET $url"
            curl --fail --silent --show-error --location --compressed \
              --retry 2 --retry-delay 1 \
              --user-agent "$UA" \
              --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
              --referer 'https://www.meitetsu.co.jp/' \
              --cookie "$COOKIE_JAR" --cookie-jar "$COOKIE_JAR" \
              "$url" -o "$output"
            test -s "$output"
          }

          fetch \
            "$BASE/map/Top?window=transfer" \
            /tmp/meitetsu-direct-top.html

          fetch \
            "$BASE/diagram/TrainDiagram?direction=up&linkId=00000885&rule=c&startId=00004372" \
            /tmp/meitetsu-nagoya-main-east.html

          fetch \
            "$BASE/transfer/DepArrTimeList?date=2026-09-04&gnode=00006039&snode=00004372" \
            /tmp/meitetsu-direct-NH24.html

          fetch \
            "$BASE/transfer/DepArrTimeList?date=2026-09-04&gnode=00008608&snode=00004372" \
            /tmp/meitetsu-direct-NH27.html

      - name: Inspect official HTML and sample final direct trains
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/poc-meitetsu-main-nagoya.py

      - name: Show diagnostics
        if: always()
        shell: bash
        run: |
          for path in \
            /tmp/meitetsu-main-node-discovery.json \
            /tmp/meitetsu-main-origin-diagnostics.json \
            /tmp/meitetsu-main-sample-boundaries.json \
            /tmp/meitetsu-direct-NH24-diagnostics.json \
            /tmp/meitetsu-direct-NH27-diagnostics.json
          do
            if [ -f "$path" ]; then
              echo "==== $path ===="
              cat "$path"
            fi
          done

      - name: Upload PoC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meitetsu-main-nagoya-poc
          if-no-files-found: warn
          path: |
            /tmp/meitetsu-direct-top.html
            /tmp/meitetsu-nagoya-main-east.html
            /tmp/meitetsu-direct-NH24.html
            /tmp/meitetsu-direct-NH27.html
            /tmp/meitetsu-main-node-discovery.json
            /tmp/meitetsu-main-origin-diagnostics.json
            /tmp/meitetsu-main-sample-boundaries.json
            /tmp/meitetsu-direct-NH24-diagnostics.json
            /tmp/meitetsu-direct-NH27-diagnostics.json
