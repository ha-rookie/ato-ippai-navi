name: Verify Meitetsu Main Nagoya

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-meitetsu-main-nagoya.yml'
      - 'scripts/poc-meitetsu-main-nagoya.py'
      - 'src/data/last-trains-nagoya.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve representative service dates
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Tokyo")).date()

          weekday = today
          while weekday.weekday() >= 5:
              weekday += timedelta(days=1)

          saturday = today + timedelta(days=(5 - today.weekday()) % 7)

          print(f"MEITETSU_WEEKDAY_DATE={weekday.isoformat()}")
          print(f"MEITETSU_HOLIDAY_DATE={saturday.isoformat()}")
          PY

      - name: Download official Meitetsu sources
        shell: bash
        run: |
          set -euo pipefail

          echo "weekday=$MEITETSU_WEEKDAY_DATE holiday=$MEITETSU_HOLIDAY_DATE"

          BASE='https://trainbus.meitetsu.co.jp/meitetsu-transfer/pc'
          COOKIE_JAR=/tmp/meitetsu-cookies.txt
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'

          fetch() {
            local url="$1"
            local output="$2"
            echo "GET $url"
            curl --fail --silent --show-error --location --compressed \
              --retry 2 --retry-delay 1 \
              --user-agent "$UA" \
              --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              --header 'Accept-Language: ja,en-US;q=0.7,en;q=0.3' \
              --referer 'https://www.meitetsu.co.jp/' \
              --cookie "$COOKIE_JAR" --cookie-jar "$COOKIE_JAR" \
              "$url" -o "$output"
            test -s "$output"
          }

          fetch \
            "$BASE/map/Top?window=transfer" \
            /tmp/meitetsu-direct-top.html

          # NH36 timetable is a secondary diagnostic. On GitHub runners this
          # endpoint can return the route selector instead of timetable rows.
          fetch \
            "$BASE/diagram/TrainDiagram?direction=up&linkId=00000885&rule=c&startId=00004372" \
            /tmp/meitetsu-nagoya-main-east.html

          declare -A NODES=(
            [NH24]=00006039
            [NH25]=00008842
            [NH26]=00002805
            [NH27]=00008608
            [NH28]=00008474
            [NH29]=00008447
            [NH30]=00002879
            [NH31]=00002182
            [NH32]=00008437
            [NH33]=00004438
            [NH34]=00001879
            [NH35]=00000095
            [NH37]=00000654
            [NH38]=00006826
          )

          for code in NH24 NH25 NH26 NH27 NH28 NH29 NH30 NH31 NH32 NH33 NH34 NH35 NH37 NH38; do
            fetch \
              "$BASE/transfer/DepArrTimeList?date=$MEITETSU_WEEKDAY_DATE&gnode=${NODES[$code]}&snode=00004372" \
              "/tmp/meitetsu-direct-${code}-weekday.html"
            fetch \
              "$BASE/transfer/DepArrTimeList?date=$MEITETSU_HOLIDAY_DATE&gnode=${NODES[$code]}&snode=00004372" \
              "/tmp/meitetsu-direct-${code}-saturday_holiday.html"
          done

      - name: Generate official NH24-NH38 boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/poc-meitetsu-main-nagoya.py

      - name: Validate official extraction
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          with open('/tmp/meitetsu-main-last-trains.json', encoding='utf-8') as f:
              data = json.load(f)

          expected_nodes = {
              'NH24': ('中京競馬場前', '00006039'),
              'NH25': ('有松', '00008842'),
              'NH26': ('左京山', '00002805'),
              'NH27': ('鳴海', '00008608'),
              'NH28': ('本星崎', '00008474'),
              'NH29': ('本笠寺', '00008447'),
              'NH30': ('桜', '00002879'),
              'NH31': ('呼続', '00002182'),
              'NH32': ('堀田', '00008437'),
              'NH33': ('神宮前', '00004438'),
              'NH34': ('金山', '00001879'),
              'NH35': ('山王', '00000095'),
              'NH36': ('名鉄名古屋', '00004372'),
              'NH37': ('栄生', '00000654'),
              'NH38': ('東枇杷島', '00006826'),
          }

          assert set(data['destinations']) == set(expected_nodes)
          assert data['origin'] == {
              'code': 'NH36', 'name': '名鉄名古屋', 'nodeId': '00004372'
          }
          assert data['destinations']['NH36']['walkHome'] is True
          assert data['destinations']['NH36']['routes'] == {}

          for code, (name, node_id) in expected_nodes.items():
              destination = data['destinations'][code]
              assert destination['name'] == name, code
              assert destination['officialStationCode'] == code, code
              assert destination['officialNodeId'] == node_id, code
              if code == 'NH36':
                  continue
              for day_type in ('weekday', 'saturday_holiday'):
                  route = destination['routes'][day_type]
                  assert route['lastDeparture'], (code, day_type)
                  assert route['lastArrival'], (code, day_type)
                  assert route['trainClass'], (code, day_type)
                  assert route['trainTerminal'], (code, day_type)
                  assert route['parser'] == 'time-detail-html', (code, day_type)

          print('Meitetsu Main official extraction validation: OK')
          PY

      - name: Compare official boundaries with production JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          SOURCE_ID = 'meitetsu-main-official-direct-timetable'

          with open('/tmp/meitetsu-main-last-trains.json', encoding='utf-8') as f:
              official = json.load(f)
          with open('src/data/last-trains-nagoya.json', encoding='utf-8') as f:
              production = json.load(f)

          source_ids = {item['id'] for item in production['sources']}
          assert SOURCE_ID in source_ids
          assert 'NH36' in production['origins']['nagoya']['stationCodes']

          for code, extracted in official['destinations'].items():
              prod = production['destinations'].get(code)
              assert prod is not None, f'missing production destination: {code}'
              assert prod['operator'] == 'meitetsu', code
              assert prod['officialStationCode'] == code, code
              assert prod['name'] == extracted['name'], code
              assert prod['enabled'] is True, code

              if code == 'NH36':
                  assert prod['routes'] == {}, code
                  continue

              assert set(prod['routes']) == {'nagoya'}, code
              for day_type in ('weekday', 'saturday_holiday'):
                  live = extracted['routes'][day_type]
                  saved = prod['routes']['nagoya'][day_type]

                  for field in (
                      'lastDeparture', 'lastArrival', 'trainClass', 'trainTerminal'
                  ):
                      assert saved[field] == live[field], (
                          code, day_type, field, saved[field], live[field]
                      )

                  assert saved['routeSummary'] == (
                      f"名鉄名古屋本線 {live['trainClass']} 直通"
                  ), (code, day_type)
                  assert saved['transfers'] == 0, (code, day_type)
                  assert saved['status'] == 'verified', (code, day_type)
                  assert saved['sourceIds'] == [SOURCE_ID], (code, day_type)

          print('Meitetsu Main production JSON matches official timetable: OK')
          PY

      - name: Show boundary summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/meitetsu-main-last-trains.json ]; then
            python3 - <<'PY'
          import json
          with open('/tmp/meitetsu-main-last-trains.json', encoding='utf-8') as f:
              data = json.load(f)
          print('service dates:', data['serviceDates'])
          for code, destination in data['destinations'].items():
              if code == 'NH36':
                  print(f"{code} {destination['name']}: walk-home")
                  continue
              weekday = destination['routes']['weekday']
              holiday = destination['routes']['saturday_holiday']
              print(
                  f"{code} {destination['name']}: "
                  f"weekday {weekday['lastDeparture']}->{weekday['lastArrival']} "
                  f"{weekday['trainClass']} {weekday['trainTerminal']} / "
                  f"holiday {holiday['lastDeparture']}->{holiday['lastArrival']} "
                  f"{holiday['trainClass']} {holiday['trainTerminal']}"
              )
          PY
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meitetsu-main-nagoya-official
          if-no-files-found: warn
          path: |
            /tmp/meitetsu-direct-top.html
            /tmp/meitetsu-nagoya-main-east.html
            /tmp/meitetsu-direct-*.html
            /tmp/meitetsu-main-node-discovery.json
            /tmp/meitetsu-main-origin-diagnostics.json
            /tmp/meitetsu-main-last-trains.json
            /tmp/meitetsu-direct-*-diagnostics.json
