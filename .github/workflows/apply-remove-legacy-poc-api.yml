name: Apply Legacy PoC API Cleanup

on:
  push:
    branches:
      - cleanup/remove-legacy-poc-api
    paths:
      - 'scripts/remove-legacy-poc-api.py'
      - '.github/workflows/apply-remove-legacy-poc-api.yml'
      - 'src/index.js'
      - 'src/decision.js'
      - 'test/decision.test.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/remove-legacy-poc-api

      - name: Apply deterministic cleanup
        run: python3 scripts/remove-legacy-poc-api.py

      - name: Validate JavaScript syntax
        run: node --check src/index.js

      - name: Run unit tests
        run: npm test

      - name: Verify legacy routes and files are gone
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/decision.js
          test ! -e test/decision.test.js
          ! grep -q 'travelMode: "TRANSIT"' src/index.js
          ! grep -q '/api/transit' src/index.js
          ! grep -q '/api/evaluate' src/index.js
          ! grep -q '/api/decision-poc' src/index.js
          ! grep -q '/api/decision-from-current-location' src/index.js
          grep -q '/api/tonight-decision' src/index.js
          grep -q '/api/last-train-boundary' src/index.js
          echo 'Legacy PoC removal verification: OK'

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/index.js src/decision.js test/decision.test.js
          git commit -m 'cleanup: remove legacy Google TRANSIT PoC API'
          git push origin HEAD:cleanup/remove-legacy-poc-api
