name: Deploy Worker to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'wrangler.worker.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/last-train.js
          node --check src/ops-csv.js

      - name: Run unit tests
        run: npm test

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: deploy --config wrangler.worker.jsonc --var BUILD_SHA:${{ github.sha }}

      - name: Core API production smoke
        env:
          BASE_URL: https://ato-ippai-api-poc.edward-se-pg.workers.dev
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          ready=0
          for attempt in $(seq 1 15); do
            echo "Worker build SHA readiness attempt $attempt/15"
            if curl -fsS "$BASE_URL/health" -o /tmp/health.json; then
              if EXPECTED_BUILD_SHA="$EXPECTED_BUILD_SHA" python3 - <<'PY'
          import json
          import os
          import sys

          with open('/tmp/health.json', encoding='utf-8') as f:
              data = json.load(f)

          valid = (
              data.get('ok') is True
              and data.get('service') == 'ato-ippai-api-poc'
              and data.get('googleApiKeyConfigured') is True
              and data.get('buildSha') == os.environ['EXPECTED_BUILD_SHA']
          )
          if not valid:
              print(
                  'Deployed Worker commit is not visible yet: '
                  f"expected={os.environ['EXPECTED_BUILD_SHA']}, "
                  f"actual={data.get('buildSha')}"
              )
              sys.exit(1)
          print('Worker build SHA smoke test: OK')
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Expected Worker build SHA was not visible within 30 seconds.'
            exit 1
          fi

          for path in walk drive taxi-estimate; do
            status=$(curl -sS \
              -o "/tmp/removed-${path}.json" \
              -w '%{http_code}' \
              -H 'content-type: application/json' \
              --data '{}' \
              "$BASE_URL/api/$path")
            echo "Removed endpoint /api/$path -> HTTP $status"
            test "$status" = '404'
          done
          echo 'Removed public Google Routes proxy endpoints smoke test: OK'

          curl -fsS "$BASE_URL/ops/last-train-boundaries.csv" -o /tmp/last-train-boundaries.csv
          python3 - <<'PY'
          import csv

          with open('/tmp/last-train-boundaries.csv', encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))

          expected_columns = [
              '目的駅コード', '駅名', '事業者', '路線', 'hub', '曜日区分',
              '最終出発', '最終到着', '経路概要', '列車行先', '乗換回数',
              '乗換駅', '接続列車発車', '乗換余裕(分)', 'status', 'sourceIds'
          ]
          assert rows, 'ops CSV must contain production boundaries'
          assert list(rows[0].keys()) == expected_columns, rows[0].keys()
          assert len(rows) > 100, len(rows)
          assert any(
              row['目的駅コード'] == 'H22'
              and row['駅名'] == '藤が丘'
              and row['status'] == 'verified'
              for row in rows
          )
          assert any(
              row['目的駅コード'] == 'KM12'
              and row['駅名'] == '味鋺'
              and row['乗換駅'] == '平安通'
              and row['status'] == 'verified'
              for row in rows
          )
          print(f'Last-train operations CSV smoke test: OK ({len(rows)} rows)')
          PY

          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, time
          from zoneinfo import ZoneInfo

          jst = ZoneInfo('Asia/Tokyo')
          now = datetime.now(jst)
          target = datetime.combine(now.date(), time(23, 20), tzinfo=jst)
          if target <= now:
              target += timedelta(days=1)

          day_type = 'weekday' if target.weekday() < 5 else 'saturday_holiday'
          departure_time = target.isoformat(timespec='seconds')

          boundary = {
              'origin': {'latitude': 35.1715, 'longitude': 136.9057},
              'departureTime': departure_time,
              'dayType': day_type,
              'destinationCode': 'H22',
              'offsetMinutes': [0, 15, 30, 60],
              'stationBufferMinutes': 3,
              'minimumBoardingLeadMinutes': 1,
          }
          tonight = {**boundary, 'includeDispatchFee': True}
          override = {**tonight, 'taxiDestination': '東京駅'}

          with open('/tmp/core-boundary-request.json', 'w', encoding='utf-8') as f:
              json.dump(boundary, f, ensure_ascii=False)
          with open('/tmp/tonight-request.json', 'w', encoding='utf-8') as f:
              json.dump(tonight, f, ensure_ascii=False)
          with open('/tmp/override-request.json', 'w', encoding='utf-8') as f:
              json.dump(override, f, ensure_ascii=False)
          PY

          curl -fsS \
            -H 'content-type: application/json' \
            --data @/tmp/core-boundary-request.json \
            "$BASE_URL/api/last-train-boundary" \
            -o /tmp/core-boundary.json

          python3 - <<'PY'
          import json

          with open('/tmp/core-boundary.json', encoding='utf-8') as f:
              data = json.load(f)

          scenarios = data['scenarios']
          assert data['routeFound'] is True, data
          assert data['dataSource'] == 'internal_last_train_json', data
          assert data['destination']['code'] == 'H22', data
          assert set(data['walkOptions']) == {'sakae', 'fushimi'}, data['walkOptions']
          assert len(scenarios) == 4, scenarios
          assert scenarios[0]['canReachDestination'] is True, scenarios
          assert scenarios[-1]['canReachDestination'] is False, scenarios
          print('Core last-train boundary smoke test: OK')
          PY

          curl -fsS \
            -H 'content-type: application/json' \
            --data @/tmp/tonight-request.json \
            "$BASE_URL/api/tonight-decision" \
            -o /tmp/tonight.json

          python3 - <<'PY'
          import json

          with open('/tmp/tonight.json', encoding='utf-8') as f:
              data = json.load(f)

          assert data['destinationCode'] == 'H22', data
          assert data['destinationName'] == '藤が丘', data
          assert data['taxiDestination'] == '藤が丘駅 愛知県名古屋市', data
          assert data['train']['routeFound'] is True, data['train']
          assert data['taxi']['routeFound'] is True, data['taxi']
          assert data['taxi']['distanceMeters'] > 10000, data['taxi']
          assert data['taxi']['nightSurcharge'] is True, data['taxi']
          assert data['taxi']['estimatedTotalYen'] > 5000, data['taxi']
          assert data['taxi']['method'] == 'distance_only_approximation', data['taxi']
          assert len(data['scenarios']) == 4, data['scenarios']
          assert data['scenarios'][-1]['recommendedMode'] == 'taxi', data['scenarios']
          print('Tonight decision train + fixed-destination taxi smoke test: OK')
          PY

          override_status=$(curl -sS \
            -o /tmp/override.json \
            -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data @/tmp/override-request.json \
            "$BASE_URL/api/tonight-decision")
          test "$override_status" = '400'
          grep -q 'taxiDestination override is not allowed' /tmp/override.json
          echo 'taxiDestination override rejection smoke test: OK'
