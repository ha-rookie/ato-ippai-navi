name: Deploy Worker to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Worker syntax
        run: node --check src/index.js

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: deploy

      - name: Smoke test
        env:
          BASE_URL: https://ato-ippai-api-poc.edward-se-pg.workers.dev
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 15); do
            echo "Smoke test attempt $attempt/15"

            if curl -fsS "$BASE_URL/health" -o /tmp/health.json; then
              cat /tmp/health.json

              if python3 - <<'PY'
          import json
          import sys

          with open("/tmp/health.json", encoding="utf-8") as f:
              data = json.load(f)

          valid = (
              data.get("ok") is True
              and data.get("service") == "ato-ippai-api-poc"
              and data.get("googleApiKeyConfigured") is True
          )

          if not valid:
              print(f"Not ready yet: {data}")
              sys.exit(1)

          print("Worker health smoke test: OK")
          PY
              then
                exit 0
              fi
            fi

            sleep 2
          done

          echo "Worker did not expose the expected health response within 30 seconds."
          exit 1
