name: Deploy Worker to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'test/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/last-train.js
          node --check public/app.js
          node --check public/js/sleep.js
          node --check public/js/settings.js

      - name: Run unit tests
        run: npm test

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: deploy --var BUILD_SHA:${{ github.sha }}

      - name: Smoke test
        env:
          BASE_URL: https://ato-ippai-api-poc.edward-se-pg.workers.dev
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          ready=0

          for attempt in $(seq 1 15); do
            echo "Build SHA readiness attempt $attempt/15"

            if curl -fsS "$BASE_URL/health" -o /tmp/health.json; then
              cat /tmp/health.json

              if EXPECTED_BUILD_SHA="$EXPECTED_BUILD_SHA" python3 - <<'PY'
          import json
          import os
          import sys

          expected = os.environ["EXPECTED_BUILD_SHA"]

          with open("/tmp/health.json", encoding="utf-8") as f:
              data = json.load(f)

          valid = (
              data.get("ok") is True
              and data.get("service") == "ato-ippai-api-poc"
              and data.get("googleApiKeyConfigured") is True
              and data.get("buildSha") == expected
          )

          if not valid:
              print(
                  "Deployed commit is not visible yet: "
                  f"expected={expected}, actual={data.get('buildSha')}"
              )
              sys.exit(1)

          print(f"Worker build SHA smoke test: OK ({expected})")
          PY
              then
                ready=1
                break
              fi
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Expected Worker build SHA was not visible within 30 seconds."
            exit 1
          fi

          curl -fsS "$BASE_URL/" -o /tmp/index.html
          grep -q "<title>あと一杯ナビ</title>" /tmp/index.html
          grep -q "現在地から判定する" /tmp/index.html
          echo "Web MVP smoke test: OK"

          cat > /tmp/decision-request.json <<'JSON'
          {
            "departureTime": "2026-09-04T23:20:00+09:00",
            "dayType": "weekday",
            "offsetMinutes": [0, 15, 30, 60]
          }
          JSON

          curl -fsS             -H "content-type: application/json"             --data @/tmp/decision-request.json             "$BASE_URL/api/decision-poc"             -o /tmp/decision.json

          cat /tmp/decision.json

          python3 - <<'PY'
          import json

          with open("/tmp/decision.json", encoding="utf-8") as f:
              data = json.load(f)

          scenarios = data["scenarios"]

          assert [item["canReachDestination"] for item in scenarios] == [
              True, True, True, False
          ], scenarios

          assert [item["nextTrain"] for item in scenarios] == [
              "23:22", "23:42", "23:52", None
          ], scenarios

          assert all(item["lastTrain"] == "00:02" for item in scenarios), scenarios

          print("Decision API smoke test: OK")
          PY

          cat > /tmp/taxi-request.json <<'JSON'
          {
            "origin": {
              "latitude": 35.1715,
              "longitude": 136.9057
            },
            "destination": {
              "latitude": 35.1822,
              "longitude": 137.0216
            },
            "departureTime": "2026-09-04T23:20:00+09:00",
            "includeDispatchFee": true
          }
          JSON

          curl -fsS \
            -H "content-type: application/json" \
            --data @/tmp/taxi-request.json \
            "$BASE_URL/api/taxi-estimate" \
            -o /tmp/taxi.json

          cat /tmp/taxi.json

          python3 - <<'PY'
          import json

          with open("/tmp/taxi.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data["routeFound"] is True, data
          assert data["distanceMeters"] > 10000, data
          assert data["nightSurcharge"] is True, data
          assert data["estimatedTotalYen"] > 5000, data
          assert data["method"] == "distance_only_approximation", data

          print("Taxi estimate API smoke test: OK")
          PY

          cat > /tmp/walk-decision-request.json <<'JSON'
          {
            "origin": {
              "latitude": 35.1715,
              "longitude": 136.9057
            },
            "departureTime": "2026-09-04T23:20:00+09:00",
            "dayType": "weekday",
            "offsetMinutes": [0, 15, 30, 60],
            "stationBufferMinutes": 3
          }
          JSON

          capability_ready=0

          for attempt in $(seq 1 15); do
            echo "Capability smoke test attempt $attempt/15"

            if curl -fsS \
              -H "content-type: application/json" \
              --data @/tmp/walk-decision-request.json \
              "$BASE_URL/api/decision-from-current-location" \
              -o /tmp/walk-decision.json
            then
              cat /tmp/walk-decision.json

              if python3 - <<'PY'
          import json
          import sys

          with open("/tmp/walk-decision.json", encoding="utf-8") as f:
              data = json.load(f)

          ready = (
              data.get("routeFound") is True
              and data.get("access", {}).get("minimumBoardingLeadMinutes") == 1
          )

          if not ready:
              print("Expected Worker capability is not visible yet.")
              sys.exit(1)

          print("Expected Worker capability is visible.")
          PY
              then
                capability_ready=1
                break
              fi
            fi

            sleep 2
          done

          if [ "$capability_ready" -ne 1 ]; then
            echo "New Worker capability was not visible within 30 seconds."
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("/tmp/walk-decision.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data["routeFound"] is True, data
          assert data["walk"]["distanceMeters"] > 0, data
          assert 1 <= data["walk"]["walkMinutes"] <= 30, data
          assert data["access"]["stationBufferMinutes"] == 3, data
          assert data["access"]["minimumBoardingLeadMinutes"] == 1, data

          scenarios = data["scenarios"]
          assert len(scenarios) == 4, scenarios
          assert scenarios[0]["canReachDestination"] is True, scenarios
          assert scenarios[1]["localStationReadyTime"] == "23:42", scenarios
          assert scenarios[1]["nextTrain"] == "23:52", scenarios
          assert scenarios[-1]["canReachDestination"] is False, scenarios
          assert all(item["lastTrain"] == "00:02" for item in scenarios), scenarios

          print("Walk + decision API smoke test: OK")
          PY

          cat > /tmp/last-train-boundary-request.json <<'JSON'
          {
            "origin": {
              "latitude": 35.1715,
              "longitude": 136.9057
            },
            "departureTime": "2026-09-04T23:20:00+09:00",
            "dayType": "weekday",
            "destinationCode": "H22",
            "offsetMinutes": [0, 15, 30, 60],
            "stationBufferMinutes": 3,
            "minimumBoardingLeadMinutes": 1
          }
          JSON

          boundary_ready=0

          for attempt in $(seq 1 15); do
            echo "Last-train boundary smoke test attempt $attempt/15"

            if curl -fsS \
              -H "content-type: application/json" \
              --data @/tmp/last-train-boundary-request.json \
              "$BASE_URL/api/last-train-boundary" \
              -o /tmp/last-train-boundary.json
            then
              cat /tmp/last-train-boundary.json

              if python3 - <<'PY'
          import json
          import sys

          with open("/tmp/last-train-boundary.json", encoding="utf-8") as f:
              data = json.load(f)

          scenarios = data.get("scenarios", [])
          ready = (
              data.get("routeFound") is True
              and data.get("dataSource") == "internal_last_train_json"
              and data.get("destination", {}).get("code") == "H22"
              and len(scenarios) == 4
          )

          if not ready:
              sys.exit(1)
          PY
              then
                boundary_ready=1
                break
              fi
            fi

            sleep 2
          done

          if [ "$boundary_ready" -ne 1 ]; then
            echo "Last-train boundary API was not ready within 30 seconds."
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("/tmp/last-train-boundary.json", encoding="utf-8") as f:
              data = json.load(f)

          scenarios = data["scenarios"]

          assert data["walkOptions"]["sakae"]["routeFound"] is True, data
          assert data["walkOptions"]["fushimi"]["routeFound"] is True, data
          assert scenarios[0]["canReachDestination"] is True, scenarios
          assert scenarios[0]["recommendedOriginId"] in {"sakae", "fushimi"}, scenarios
          assert scenarios[0]["lastDeparture"] in {"00:02", "00:00"}, scenarios
          assert scenarios[2]["canReachDestination"] is True, scenarios
          assert scenarios[3]["canReachDestination"] is False, scenarios

          print("Last-train boundary API smoke test: OK")
          PY

          cat > /tmp/h18-boundary-request.json <<'JSON'
          {
            "origin": {
              "latitude": 35.1715,
              "longitude": 136.9057
            },
            "departureTime": "2026-09-05T00:05:00+09:00",
            "dayType": "weekday",
            "destinationCode": "H18",
            "offsetMinutes": [0],
            "stationBufferMinutes": 3,
            "minimumBoardingLeadMinutes": 1
          }
          JSON

          curl -fsS \
            -H "content-type: application/json" \
            --data @/tmp/h18-boundary-request.json \
            "$BASE_URL/api/last-train-boundary" \
            -o /tmp/h18-boundary.json

          cat /tmp/h18-boundary.json

          python3 - <<'PY'
          import json

          with open("/tmp/h18-boundary.json", encoding="utf-8") as f:
              data = json.load(f)

          scenario = data["scenarios"][0]

          assert data["destination"]["code"] == "H18", data
          assert data["destination"]["name"] == "星ヶ丘", data
          assert scenario["canReachDestination"] is True, scenario
          assert scenario["recommendedOriginId"] == "sakae", scenario
          assert scenario["lastDeparture"] == "00:16", scenario
          assert scenario["localLastTrainArrivalTime"] is None, scenario

          print("Expanded Higashiyama H18 smoke test: OK")
          PY

          cat > /tmp/h18-tonight-request.json <<'JSON'
          {
            "origin": {
              "latitude": 35.1715,
              "longitude": 136.9057
            },
            "departureTime": "2026-09-05T00:05:00+09:00",
            "dayType": "weekday",
            "destinationCode": "H18",
            "offsetMinutes": [0, 60],
            "stationBufferMinutes": 3,
            "minimumBoardingLeadMinutes": 1,
            "includeDispatchFee": true
          }
          JSON

          curl -fsS \
            -H "content-type: application/json" \
            --data @/tmp/h18-tonight-request.json \
            "$BASE_URL/api/tonight-decision" \
            -o /tmp/h18-tonight.json

          python3 - <<'PY'
          import json

          with open("/tmp/h18-tonight.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data["destinationCode"] == "H18", data
          assert data["destinationName"] == "星ヶ丘", data
          assert data["taxiDestination"] == "星ヶ丘駅 愛知県名古屋市", data
          assert data["train"]["destination"]["code"] == "H18", data
          assert data["scenarios"][0]["recommendedMode"] == "train", data

          print("Selected destination H18 tonight smoke test: OK")
          PY

          cat > /tmp/tonight-request.json <<'JSON'
          {
            "origin": {
              "latitude": 35.1715,
              "longitude": 136.9057
            },
            "departureTime": "2026-09-04T23:20:00+09:00",
            "dayType": "weekday",
            "offsetMinutes": [0, 15, 30, 60],
            "stationBufferMinutes": 3,
            "minimumBoardingLeadMinutes": 1,
            "includeDispatchFee": true
          }
          JSON

          tonight_ready=0

          for attempt in $(seq 1 15); do
            echo "Tonight API smoke test attempt $attempt/15"

            if curl -fsS \
              -H "content-type: application/json" \
              --data @/tmp/tonight-request.json \
              "$BASE_URL/api/tonight-decision" \
              -o /tmp/tonight.json
            then
              cat /tmp/tonight.json

              if python3 - <<'PY'
          import json
          import sys

          with open("/tmp/tonight.json", encoding="utf-8") as f:
              data = json.load(f)

          scenarios = data.get("scenarios", [])
          ready = (
              data.get("destinationScope") == "station_only"
              and data.get("train", {}).get("dataSource")
                  == "internal_last_train_json"
              and len(scenarios) == 4
              and scenarios[0].get("recommendedMode") == "train"
              and scenarios[-1].get("recommendedMode") == "taxi"
              and data.get("taxi", {}).get("estimatedTotalYen", 0) > 5000
          )

          if not ready:
              print("Tonight decision capability is not visible yet.")
              sys.exit(1)

          print("Tonight decision capability is visible.")
          PY
              then
                tonight_ready=1
                break
              fi
            fi

            sleep 2
          done

          if [ "$tonight_ready" -ne 1 ]; then
            echo "Tonight decision API was not ready within 30 seconds."
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("/tmp/tonight.json", encoding="utf-8") as f:
              data = json.load(f)

          scenarios = data["scenarios"]

          assert data["destinationScope"] == "station_only", data
          assert data["taxiDestination"] == "藤が丘駅 愛知県名古屋市", data
          assert data["train"]["dataSource"] == "internal_last_train_json", data
          assert scenarios[0]["recommendedMode"] == "train", scenarios
          assert scenarios[0]["recommendedOriginId"] in {"sakae", "fushimi"}, scenarios
          assert scenarios[0]["lastDeparture"] in {"00:02", "00:00"}, scenarios
          assert scenarios[0]["localLastTrainArrivalTime"] == "00:23", scenarios
          assert scenarios[0]["localDestinationStationArrivalTime"] is None, scenarios
          assert scenarios[1]["recommendedMode"] == "train", scenarios
          assert scenarios[2]["recommendedMode"] == "train", scenarios
          assert scenarios[2]["usableMarginMinutes"] >= 0, scenarios
          assert scenarios[3]["recommendedMode"] == "taxi", scenarios
          assert scenarios[3]["taxiTravelMinutes"] >= 1, scenarios
          assert scenarios[3]["localDestinationStationArrivalTime"] is not None, scenarios
          assert scenarios[3]["taxiEstimatedTotalYen"] > 5000, scenarios

          print("Tonight decision API smoke test: OK")
          PY
