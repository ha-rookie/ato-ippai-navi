name: Deploy Worker to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'test/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/last-train.js
          node --check public/app.js
          node --check public/js/sleep.js
          node --check public/js/settings.js

      - name: Run unit tests
        run: npm test

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: deploy --var BUILD_SHA:${{ github.sha }}

      - name: Core production smoke
        env:
          BASE_URL: https://ato-ippai-api-poc.edward-se-pg.workers.dev
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          ready=0
          for attempt in $(seq 1 15); do
            echo "Build SHA readiness attempt $attempt/15"
            if curl -fsS "$BASE_URL/health" -o /tmp/health.json; then
              cat /tmp/health.json
              if EXPECTED_BUILD_SHA="$EXPECTED_BUILD_SHA" python3 - <<'PY'
          import json
          import os
          import sys

          with open('/tmp/health.json', encoding='utf-8') as f:
              data = json.load(f)

          valid = (
              data.get('ok') is True
              and data.get('service') == 'ato-ippai-api-poc'
              and data.get('googleApiKeyConfigured') is True
              and data.get('buildSha') == os.environ['EXPECTED_BUILD_SHA']
          )
          if not valid:
              print(
                  'Deployed commit is not visible yet: '
                  f"expected={os.environ['EXPECTED_BUILD_SHA']}, "
                  f"actual={data.get('buildSha')}"
              )
              sys.exit(1)
          print('Worker build SHA smoke test: OK')
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Expected Worker build SHA was not visible within 30 seconds.'
            exit 1
          fi

          curl -fsS "$BASE_URL/" -o /tmp/index.html
          grep -q '<title>あと一杯ナビ</title>' /tmp/index.html
          grep -q '現在地から判定する' /tmp/index.html
          echo 'Web MVP smoke test: OK'

          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, time
          from zoneinfo import ZoneInfo

          jst = ZoneInfo('Asia/Tokyo')
          now = datetime.now(jst)
          target = datetime.combine(now.date(), time(23, 20), tzinfo=jst)
          if target <= now:
              target += timedelta(days=1)

          day_type = 'weekday' if target.weekday() < 5 else 'saturday_holiday'
          departure_time = target.isoformat(timespec='seconds')

          boundary = {
              'origin': {
                  'latitude': 35.1715,
                  'longitude': 136.9057,
              },
              'departureTime': departure_time,
              'dayType': day_type,
              'destinationCode': 'H22',
              'offsetMinutes': [0, 15, 30, 60],
              'stationBufferMinutes': 3,
              'minimumBoardingLeadMinutes': 1,
          }
          taxi = {
              'origin': {
                  'latitude': 35.1715,
                  'longitude': 136.9057,
              },
              'destination': {
                  'latitude': 35.1822,
                  'longitude': 137.0216,
              },
              'departureTime': departure_time,
              'includeDispatchFee': True,
          }

          with open('/tmp/core-boundary-request.json', 'w', encoding='utf-8') as f:
              json.dump(boundary, f, ensure_ascii=False)
          with open('/tmp/taxi-request.json', 'w', encoding='utf-8') as f:
              json.dump(taxi, f, ensure_ascii=False)

          print(
              f'Runtime smoke service time: {departure_time} '
              f'(dayType={day_type})'
          )
          PY

          curl -fsS \
            -H 'content-type: application/json' \
            --data @/tmp/core-boundary-request.json \
            "$BASE_URL/api/last-train-boundary" \
            -o /tmp/core-boundary.json

          cat /tmp/core-boundary.json

          python3 - <<'PY'
          import json

          with open('/tmp/core-boundary.json', encoding='utf-8') as f:
              data = json.load(f)

          scenarios = data['scenarios']
          assert data['routeFound'] is True, data
          assert data['dataSource'] == 'internal_last_train_json', data
          assert data['destination']['code'] == 'H22', data
          assert set(data['walkOptions']) == {'sakae', 'fushimi'}, data['walkOptions']
          assert len(scenarios) == 4, scenarios
          assert scenarios[0]['canReachDestination'] is True, scenarios
          assert scenarios[0]['recommendedOriginId'] in {'sakae', 'fushimi'}, scenarios
          assert scenarios[0]['lastDeparture'] in {'00:02', '00:00'}, scenarios
          assert scenarios[-1]['canReachDestination'] is False, scenarios
          print('Core last-train boundary smoke test: OK')
          PY

          curl -fsS \
            -H 'content-type: application/json' \
            --data @/tmp/taxi-request.json \
            "$BASE_URL/api/taxi-estimate" \
            -o /tmp/taxi.json

          cat /tmp/taxi.json

          python3 - <<'PY'
          import json

          with open('/tmp/taxi.json', encoding='utf-8') as f:
              data = json.load(f)

          assert data['routeFound'] is True, data
          assert data['distanceMeters'] > 10000, data
          assert data['nightSurcharge'] is True, data
          assert data['estimatedTotalYen'] > 5000, data
          assert data['method'] == 'distance_only_approximation', data
          print('Dynamic future-time taxi smoke test: OK')
          PY
