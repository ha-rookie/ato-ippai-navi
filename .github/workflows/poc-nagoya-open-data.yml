name: PoC Nagoya Subway Open Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-nagoya-open-data.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Inspect Higashiyama XLSX structure
        shell: bash
        run: |
          set -euo pipefail

          URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/46beb3f0-6707-46ee-9d9d-2b3bb2567965/download/20250329_subway-timetable-higashiyamaline_.zip'
          curl -fsSL "$URL" -o /tmp/higashiyama.zip

          python3 - <<'PY'
          import io
          import re
          import zipfile
          import xml.etree.ElementTree as ET

          NS = {"m": "http://schemas.openxmlformats.org/spreadsheetml/2006/main"}

          def recover_name(name):
              try:
                  return name.encode("cp437").decode("cp932")
              except (UnicodeEncodeError, UnicodeDecodeError):
                  return name

          def col_to_num(ref):
              m = re.match(r"([A-Z]+)", ref)
              if not m:
                  return 0
              n = 0
              for ch in m.group(1):
                  n = n * 26 + ord(ch) - 64
              return n

          def shared_strings(book):
              path = "xl/sharedStrings.xml"
              if path not in book.namelist():
                  return []
              root = ET.fromstring(book.read(path))
              out = []
              for si in root.findall("m:si", NS):
                  parts = [t.text or "" for t in si.findall(".//m:t", NS)]
                  out.append("".join(parts))
              return out

          def cell_value(cell, strings):
              cell_type = cell.attrib.get("t")
              if cell_type == "inlineStr":
                  return "".join(t.text or "" for t in cell.findall(".//m:t", NS))

              v = cell.find("m:v", NS)
              if v is None or v.text is None:
                  f = cell.find("m:f", NS)
                  return f"FORMULA:{f.text}" if f is not None else ""

              raw = v.text
              if cell_type == "s":
                  try:
                      return strings[int(raw)]
                  except (ValueError, IndexError):
                      return raw
              if cell_type == "b":
                  return raw == "1"
              return raw

          with zipfile.ZipFile("/tmp/higashiyama.zip") as outer:
              xlsx_entries = [
                  info for info in outer.infolist()
                  if not info.is_dir() and info.filename.lower().endswith(".xlsx")
              ]

              recovered = [(info, recover_name(info.filename)) for info in xlsx_entries]

              print("=== Recovered filenames ===")
              for _, name in recovered:
                  print(name)

              targets = []
              for info, name in recovered:
                  if "栄" in name or "藤が丘" in name:
                      targets.append((info, name))

              print()
              print("=== Target files ===")
              for _, name in targets:
                  print(name)

              if len(targets) < 2:
                  raise SystemExit("Could not identify both 栄 and 藤が丘 workbook files")

              for info, name in targets:
                  print()
                  print("=" * 100)
                  print(f"WORKBOOK: {name}")
                  print("=" * 100)

                  data = outer.read(info)
                  with zipfile.ZipFile(io.BytesIO(data)) as book:
                      strings = shared_strings(book)
                      print(f"sharedStrings: {len(strings)}")

                      workbook_root = ET.fromstring(book.read("xl/workbook.xml"))
                      sheet_names = [
                          s.attrib.get("name")
                          for s in workbook_root.findall(".//m:sheets/m:sheet", NS)
                      ]
                      print("sheets:", sheet_names)

                      sheet_paths = sorted(
                          p for p in book.namelist()
                          if p.startswith("xl/worksheets/sheet") and p.endswith(".xml")
                      )
                      print("worksheet xml:", sheet_paths)

                      for sheet_path in sheet_paths[:3]:
                          print()
                          print(f"--- {sheet_path} ---")
                          root = ET.fromstring(book.read(sheet_path))

                          shown = 0
                          for row in root.findall(".//m:sheetData/m:row", NS):
                              cells = []
                              for cell in row.findall("m:c", NS):
                                  ref = cell.attrib.get("r", "")
                                  if col_to_num(ref) > 26:
                                      continue
                                  value = cell_value(cell, strings)
                                  if value not in ("", None):
                                      cells.append(f"{ref}={value}")

                              if cells:
                                  print(" | ".join(cells))
                                  shown += 1

                              if shown >= 80:
                                  print("... truncated after 80 non-empty rows ...")
                                  break
          PY
