name: PoC Nagoya Subway Open Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-nagoya-open-data.yml'
      - 'scripts/extract-nagoya-subway.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate normalized Sakae and Fushimi timetables
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/46beb3f0-6707-46ee-9d9d-2b3bb2567965/download/20250329_subway-timetable-higashiyamaline_.zip'

          curl -fsSL "$SOURCE_URL" -o /tmp/higashiyama.zip

          python3 scripts/extract-nagoya-subway.py \
            --zip /tmp/higashiyama.zip \
            --output /tmp/sakae-higashiyama.json \
            --station-code H10 \
            --station-name 栄 \
            --direction-sheet 下り \
            --default-terminal 藤が丘 \
            --revision 2025-03-29 \
            --source-url "$SOURCE_URL"

          python3 scripts/extract-nagoya-subway.py \
            --zip /tmp/higashiyama.zip \
            --output /tmp/fushimi-higashiyama.json \
            --station-code H09 \
            --station-name 伏見 \
            --direction-sheet 下り \
            --default-terminal 藤が丘 \
            --revision 2025-03-29 \
            --source-url "$SOURCE_URL"

          echo
          echo "=== Normalized JSON (late-night excerpt) ==="

          python3 - <<'PY'
          import json

          for path in [
              "/tmp/sakae-higashiyama.json",
              "/tmp/fushimi-higashiyama.json",
          ]:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)

              result = {
                  "source": data["source"],
                  "station": data["station"],
                  "directionSheet": data["directionSheet"],
                  "defaultTerminal": data["defaultTerminal"],
                  "markerDestinations": data["markerDestinations"],
                  "lateNight": {},
                  "lastToFujigaoka": {},
              }

              assert data["markerDestinations"].get("星") == "星ヶ丘", data["markerDestinations"]

              for day_type, departures in data["schedules"].items():
                  result["lateNight"][day_type] = [
                      item for item in departures
                      if item["serviceMinutes"] >= 23 * 60
                  ]

                  to_fujigaoka = [
                      item for item in departures
                      if item["destination"] == "藤が丘"
                  ]
                  result["lastToFujigaoka"][day_type] = to_fujigaoka[-1]

                  if data["station"]["code"] == "H10":
                      assert to_fujigaoka[-1]["time"] == "00:02", {
                          "dayType": day_type,
                          "lastToFujigaoka": to_fujigaoka[-1],
                      }

              print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload normalized timetables
        uses: actions/upload-artifact@v4
        with:
          name: sakae-fushimi-higashiyama-normalized
          path: |
            /tmp/sakae-higashiyama.json
            /tmp/fushimi-higashiyama.json
          if-no-files-found: error
          retention-days: 7
