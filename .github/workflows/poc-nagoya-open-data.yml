name: PoC Nagoya Subway Open Data

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poc-nagoya-open-data.yml'
      - 'scripts/extract-nagoya-subway.py'
      - 'scripts/generate-higashiyama-last-trains.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-nagoya-open-data.yml'
      - 'scripts/extract-nagoya-subway.py'
      - 'scripts/generate-higashiyama-last-trains.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate normalized Sakae and Fushimi timetables
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_URL='https://data.bodik.jp/dataset/e4b42f45-e415-4a48-9ff3-20faeb7c3400/resource/46beb3f0-6707-46ee-9d9d-2b3bb2567965/download/20250329_subway-timetable-higashiyamaline_.zip'

          curl -fsSL "$SOURCE_URL" -o /tmp/higashiyama.zip

          for station in "H10:栄:sakae" "H09:伏見:fushimi"; do
            IFS=':' read -r code name slug <<< "$station"

            python3 scripts/extract-nagoya-subway.py \
              --zip /tmp/higashiyama.zip \
              --output "/tmp/${slug}-up.json" \
              --station-code "$code" \
              --station-name "$name" \
              --direction-sheet 上り \
              --default-terminal 高畑 \
              --revision 2025-03-29 \
              --source-url "$SOURCE_URL"

            python3 scripts/extract-nagoya-subway.py \
              --zip /tmp/higashiyama.zip \
              --output "/tmp/${slug}-down.json" \
              --station-code "$code" \
              --station-name "$name" \
              --direction-sheet 下り \
              --default-terminal 藤が丘 \
              --revision 2025-03-29 \
              --source-url "$SOURCE_URL"
          done

      - name: Generate Higashiyama last-train boundaries
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/generate-higashiyama-last-trains.py \
            --origin sakae:H10:/tmp/sakae-up.json:/tmp/sakae-down.json \
            --origin fushimi:H09:/tmp/fushimi-up.json:/tmp/fushimi-down.json \
            --output /tmp/higashiyama-last-trains.json \
            --revision 2025-03-29

      - name: Validate generated boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          with open("/tmp/higashiyama-last-trains.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data["line"]["code"] == "H", data["line"]
          assert len(data["destinations"]) == 22, len(data["destinations"])

          # Existing verified PoC values must remain unchanged.
          assert data["destinations"]["H22"]["routes"]["sakae"]["weekday"]["lastDeparture"] == "00:02"
          assert data["destinations"]["H22"]["routes"]["fushimi"]["weekday"]["lastDeparture"] == "00:00"
          assert data["destinations"]["H22"]["routes"]["sakae"]["saturday_holiday"]["lastDeparture"] == "00:02"
          assert data["destinations"]["H22"]["routes"]["fushimi"]["saturday_holiday"]["lastDeparture"] == "00:00"

          for code, destination in data["destinations"].items():
              for origin_id, day_types in destination["routes"].items():
                  for day_type, route in day_types.items():
                      assert route["status"] == "verified", (code, origin_id, day_type, route)
                      assert route["lastDeparture"], (code, origin_id, day_type, route)
                      assert route["transfers"] == 0, (code, origin_id, day_type, route)

          print("Generated direct Higashiyama boundary validation: OK")
          print(json.dumps({
              "H01": data["destinations"]["H01"],
              "H08": data["destinations"]["H08"],
              "H18": data["destinations"]["H18"],
              "H22": data["destinations"]["H22"],
          }, ensure_ascii=False, indent=2))
          PY

          echo "=== GENERATED_HIGASHIYAMA_JSON_BEGIN ==="
          cat /tmp/higashiyama-last-trains.json
          echo "=== GENERATED_HIGASHIYAMA_JSON_END ==="

      - name: Upload generated timetable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: higashiyama-last-train-generation
          path: |
            /tmp/sakae-up.json
            /tmp/sakae-down.json
            /tmp/fushimi-up.json
            /tmp/fushimi-down.json
            /tmp/higashiyama-last-trains.json
          if-no-files-found: error
          retention-days: 7
