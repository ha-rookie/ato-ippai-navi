name: Stage JR Tokaido Production

on:
  push:
    branches: [feat/jr-tokaido-nagoya]
    paths:
      - '.github/workflows/migrate-jr-tokaido-production.yml'
      - 'scripts/migrate-jr-tokaido-production.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/jr-tokaido-nagoya

      - name: Apply production support
        run: python3 scripts/migrate-jr-tokaido-production.py

      - name: Run tests
        run: npm test

      - name: Commit generated production support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/data/last-trains-nagoya.json \
            public/index.html \
            public/js/settings.js \
            test/settings.test.js \
            test/last-train.test.js \
            .github/workflows/poc-jr-tokaido-nagoya.yml \
            .github/workflows/smoke-jr-tokaido.yml \
            docs/jr-tokaido.md
          git diff --cached --check
          git commit -m 'feat: add JR Tokaido Nagoya production support'
          git push origin HEAD:feat/jr-tokaido-nagoya
